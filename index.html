<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YukiSub Translater! — AI Anime Subtitle Workstation</title>
  <style>
:root {
  --bg-base: #080F1E;
  --bg-surface: #111D32;
  --bg-secondary: #17243B;
  --bg-elevated: #1D2D49;
  --primary: #3B82F6;
  --primary-hover: #2563EB;
  --cyan: #22D3EE;
  --text-main: #F1F5F9;
  --text-muted: #94A3B8;
  --border-subtle: rgba(148, 163, 184, 0.14);
  --border-strong: rgba(148, 163, 184, 0.28);
  --success: #10B981;
  --warning: #F59E0B;
  --danger: #EF4444;
  --sidebar-width: 252px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --transition: 180ms cubic-bezier(0.2, 0.8, 0.2, 1);
}

*, *::before, *::after {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  background-color: var(--bg-base);
  color: var(--text-main);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  overflow-x: hidden;
}

button, input, select, textarea {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
}

button {
  cursor: pointer;
}

/* Scrollbars */
::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}
::-webkit-scrollbar-track {
  background: var(--bg-base);
}
::-webkit-scrollbar-thumb {
  background: var(--bg-secondary);
  border-radius: 999px;
}
::-webkit-scrollbar-thumb:hover {
  background: var(--bg-elevated);
}

/* App Shell */
.app-shell {
  display: flex;
  min-height: 100vh;
  width: 100%;
}

/* Sidebar */
.sidebar {
  width: var(--sidebar-width);
  background: var(--bg-surface);
  border-right: 1px solid var(--border-subtle);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;
  z-index: 40;
  transition: width var(--transition), transform var(--transition);
}

.sidebar.collapsed {
  width: 72px;
}

.sidebar-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px;
  border-bottom: 1px solid var(--border-subtle);
  gap: 10px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.brand-mark {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  background: var(--bg-secondary);
  border: 1px solid rgba(34, 211, 238, 0.35);
  color: var(--cyan);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.brand-text {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.brand-title {
  font-weight: 700;
  font-size: 14px;
  color: var(--text-main);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.brand-sub {
  font-size: 11px;
  color: var(--cyan);
  white-space: nowrap;
}

.sidebar.collapsed .brand-text,
.sidebar.collapsed .nav-label,
.sidebar.collapsed .sidebar-footer-text {
  display: none;
}

.sidebar-toggle {
  background: transparent;
  border: 1px solid var(--border-subtle);
  border-radius: 8px;
  color: var(--text-muted);
  width: 30px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background var(--transition), color var(--transition);
}

.sidebar-toggle:hover {
  background: var(--bg-secondary);
  color: var(--text-main);
}

.sidebar-nav {
  flex: 1;
  overflow-y: auto;
  padding: 10px 8px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 9px 12px;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  background: transparent;
  color: var(--text-muted);
  text-align: left;
  width: 100%;
  transition: background var(--transition), color var(--transition), border-color var(--transition);
  white-space: nowrap;
}

.nav-item:hover {
  background: var(--bg-secondary);
  color: var(--text-main);
}

.nav-item.active {
  background: rgba(59, 130, 246, 0.14);
  border-color: rgba(59, 130, 246, 0.35);
  color: var(--text-main);
}

.nav-item.active .nav-icon {
  color: var(--cyan);
}

.nav-icon {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.sidebar-footer {
  padding: 12px 14px;
  border-top: 1px solid var(--border-subtle);
  font-size: 12px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Main Workspace */
.main-wrapper {
  flex: 1;
  margin-left: var(--sidebar-width);
  display: flex;
  flex-direction: column;
  min-width: 0;
  transition: margin-left var(--transition);
}

.sidebar.collapsed + .main-wrapper {
  margin-left: 72px;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  background: rgba(8, 15, 30, 0.9);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border-subtle);
  padding: 12px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}

.topbar-left {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}

.page-title {
  margin: 0;
  font-size: 18px;
  font-weight: 700;
  color: var(--text-main);
}

.topbar-right {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.main-content {
  padding: 24px;
  max-width: 1400px;
  width: 100%;
  margin: 0 auto;
  flex: 1;
}

/* Cards & Surfaces */
.card {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 20px;
}

.card-secondary {
  background: var(--bg-secondary);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 16px;
}

.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}

.card-title {
  margin: 0;
  font-size: 15px;
  font-weight: 600;
  color: var(--text-main);
}

.card-subtitle {
  margin: 4px 0 0;
  font-size: 12px;
  color: var(--text-muted);
}

/* Grids */
.grid-stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 16px;
}

.grid-2 {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
}

.grid-3 {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
}

/* Stat Card */
.stat-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  transition: border-color var(--transition), transform var(--transition);
}

.stat-card:hover {
  border-color: rgba(59, 130, 246, 0.35);
}

.stat-label {
  font-size: 12px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.stat-value {
  font-size: 22px;
  font-weight: 700;
  color: var(--text-main);
  word-break: break-word;
}

.stat-value.small-text {
  font-size: 15px;
  line-height: 1.35;
}

.stat-hint {
  font-size: 12px;
  color: var(--text-muted);
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  font-weight: 500;
  font-size: 13px;
  transition: background var(--transition), border-color var(--transition), opacity var(--transition), transform var(--transition);
  white-space: nowrap;
}

.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.btn-primary {
  background: var(--primary);
  color: #fff;
}

.btn-primary:hover:not(:disabled) {
  background: var(--primary-hover);
}

.btn-secondary {
  background: var(--bg-secondary);
  border-color: var(--border-subtle);
  color: var(--text-main);
}

.btn-secondary:hover:not(:disabled) {
  background: var(--bg-elevated);
  border-color: var(--border-strong);
}

.btn-cyan {
  background: rgba(34, 211, 238, 0.14);
  border-color: rgba(34, 211, 238, 0.38);
  color: var(--cyan);
}

.btn-cyan:hover:not(:disabled) {
  background: rgba(34, 211, 238, 0.22);
}

.btn-danger {
  background: rgba(239, 68, 68, 0.14);
  border-color: rgba(239, 68, 68, 0.35);
  color: #FCA5A5;
}

.btn-danger:hover:not(:disabled) {
  background: rgba(239, 68, 68, 0.24);
}

.btn-sm {
  padding: 5px 10px;
  font-size: 12px;
}

/* Inputs & Forms */
.form-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.form-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
}

.input, .select, .textarea {
  background: var(--bg-base);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  padding: 9px 12px;
  color: var(--text-main);
  width: 100%;
  outline: none;
  transition: border-color var(--transition);
}

.input:focus, .select:focus, .textarea:focus {
  border-color: var(--primary);
}

.textarea {
  resize: vertical;
  min-height: 90px;
}

.mono {
  font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace;
}

/* Badges */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 9px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
  border: 1px solid transparent;
  white-space: nowrap;
}

.badge-blue {
  background: rgba(59, 130, 246, 0.14);
  border-color: rgba(59, 130, 246, 0.35);
  color: #93C5FD;
}

.badge-cyan {
  background: rgba(34, 211, 238, 0.14);
  border-color: rgba(34, 211, 238, 0.35);
  color: var(--cyan);
}

.badge-success {
  background: rgba(16, 185, 129, 0.14);
  border-color: rgba(16, 185, 129, 0.35);
  color: #6EE7B7;
}

.badge-warning {
  background: rgba(245, 158, 11, 0.14);
  border-color: rgba(245, 158, 11, 0.35);
  color: #FCD34D;
}

.badge-danger {
  background: rgba(239, 68, 68, 0.14);
  border-color: rgba(239, 68, 68, 0.35);
  color: #FCA5A5;
}

.badge-muted {
  background: var(--bg-secondary);
  border-color: var(--border-subtle);
  color: var(--text-muted);
}

/* Dropzone */
.dropzone {
  border: 2px dashed var(--border-strong);
  border-radius: var(--radius-lg);
  padding: 28px 20px;
  text-align: center;
  background: var(--bg-secondary);
  transition: border-color var(--transition), background var(--transition);
  cursor: pointer;
}

.dropzone.drag-over {
  border-color: var(--cyan);
  background: rgba(34, 211, 238, 0.08);
}

/* Progress Bar */
.progress-track {
  width: 100%;
  height: 8px;
  background: var(--bg-base);
  border-radius: 999px;
  overflow: hidden;
  border: 1px solid var(--border-subtle);
}

.progress-fill {
  height: 100%;
  background: var(--primary);
  transition: width 220ms ease;
}

.progress-fill.cyan {
  background: var(--cyan);
}

/* File List Items */
.file-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 14px;
  border-radius: var(--radius-md);
  background: var(--bg-secondary);
  border: 1px solid var(--border-subtle);
  transition: border-color var(--transition), background var(--transition);
  flex-wrap: wrap;
}

.file-row.selected {
  border-color: var(--primary);
  background: rgba(59, 130, 246, 0.1);
}

/* Subtitle Editor */
.filter-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.filter-btn {
  background: var(--bg-secondary);
  border: 1px solid var(--border-subtle);
  color: var(--text-muted);
  padding: 6px 12px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 500;
  transition: all var(--transition);
}

.filter-btn:hover {
  color: var(--text-main);
  border-color: var(--border-strong);
}

.filter-btn.active {
  background: var(--primary);
  border-color: var(--primary);
  color: #fff;
}

.sub-row {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.sub-row.flag-hindi-urdu {
  border-left: 3px solid var(--warning);
}

.sub-row.flag-suspicious {
  border-left: 3px solid var(--danger);
}

.sub-row-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
}

.sub-row-cols {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.sub-source-box {
  background: var(--bg-base);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  font-size: 13px;
  white-space: pre-wrap;
  word-break: break-word;
}

/* Tables */
.table-wrap {
  width: 100%;
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

th, td {
  text-align: left;
  padding: 10px 12px;
  border-bottom: 1px solid var(--border-subtle);
  vertical-align: top;
}

th {
  color: var(--text-muted);
  font-weight: 600;
  font-size: 12px;
  background: var(--bg-secondary);
}

/* Alerts / Banners */
.alert {
  padding: 12px 14px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-subtle);
  font-size: 13px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
}

.alert-warning {
  background: rgba(245, 158, 11, 0.1);
  border-color: rgba(245, 158, 11, 0.35);
  color: #FDE68A;
}

.alert-info {
  background: rgba(59, 130, 246, 0.1);
  border-color: rgba(59, 130, 246, 0.35);
  color: #BFDBFE;
}

.alert-danger {
  background: rgba(239, 68, 68, 0.1);
  border-color: rgba(239, 68, 68, 0.35);
  color: #FECACA;
}

/* Empty State */
.empty-state {
  padding: 36px 20px;
  text-align: center;
  color: var(--text-muted);
  border: 1px dashed var(--border-subtle);
  border-radius: var(--radius-md);
  background: rgba(23, 36, 59, 0.35);
}

/* Modal & Drawer */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(8, 15, 30, 0.78);
  backdrop-filter: blur(4px);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

.modal-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-lg);
  max-width: 560px;
  width: 100%;
  max-height: 88vh;
  overflow-y: auto;
  padding: 20px;
}

/* Toast */
.toast-container {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 120;
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-width: 360px;
}

.toast {
  background: var(--bg-elevated);
  border: 1px solid var(--border-strong);
  color: var(--text-main);
  padding: 10px 14px;
  border-radius: var(--radius-md);
  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.toast.success { border-left: 3px solid var(--success); }
.toast.error { border-left: 3px solid var(--danger); }
.toast.warning { border-left: 3px solid var(--warning); }
.toast.info { border-left: 3px solid var(--cyan); }

/* Mobile Bottom Nav & More Sheet */
.mobile-nav {
  display: none;
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-surface);
  border-top: 1px solid var(--border-subtle);
  z-index: 50;
  padding: 6px 4px;
  justify-content: space-around;
}

.mobile-nav-btn {
  background: transparent;
  border: none;
  color: var(--text-muted);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  font-size: 11px;
  padding: 6px 8px;
  border-radius: var(--radius-sm);
}

.mobile-nav-btn.active {
  color: var(--cyan);
}

.more-sheet-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(8, 15, 30, 0.72);
  z-index: 90;
  display: flex;
  align-items: flex-end;
}

.more-sheet {
  width: 100%;
  background: var(--bg-surface);
  border-top: 1px solid var(--border-strong);
  border-radius: 18px 18px 0 0;
  padding: 18px 16px 28px;
  max-height: 76vh;
  overflow-y: auto;
}

.more-sheet-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  margin-top: 12px;
}

/* Responsive Breakpoints */
@media (max-width: 960px) {
  .sidebar {
    display: none;
  }
  .main-wrapper,
  .sidebar.collapsed + .main-wrapper {
    margin-left: 0;
    padding-bottom: 72px;
  }
  .mobile-nav {
    display: flex;
  }
  .toast-container {
    bottom: 78px;
    right: 12px;
    left: 12px;
    max-width: none;
  }
  .grid-2, .grid-3, .sub-row-cols {
    grid-template-columns: 1fr;
  }
  .main-content {
    padding: 16px;
  }
  .topbar {
    padding: 12px 16px;
  }
}

.stack-sm { display: flex; flex-direction: column; gap: 8px; }
.stack-md { display: flex; flex-direction: column; gap: 14px; }
.stack-lg { display: flex; flex-direction: column; gap: 20px; }
.row-wrap { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.text-muted { color: var(--text-muted); }
.text-cyan { color: var(--cyan); }
.text-sm { font-size: 12px; }
.hidden { display: none !important; }

/* === Engaging Live Translation Animations === */
@keyframes shimmerSlide {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}

@keyframes pulseRing {
  0% { transform: scale(0.92); opacity: 0.85; }
  50% { transform: scale(1.12); opacity: 0.35; }
  100% { transform: scale(0.92); opacity: 0.85; }
}

@keyframes waveBar {
  0%, 100% { transform: scaleY(0.32); opacity: 0.55; }
  50% { transform: scaleY(1); opacity: 1; }
}

@keyframes keyPop {
  0% { transform: scale(0.94); box-shadow: 0 0 0 0 rgba(34, 211, 238, 0.6); }
  50% { transform: scale(1.04); box-shadow: 0 0 14px 2px rgba(34, 211, 238, 0.35); }
  100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(34, 211, 238, 0); }
}

.live-pipeline-card {
  background: var(--bg-secondary);
  border: 1px solid rgba(34, 211, 238, 0.3);
  border-radius: var(--radius-md);
  padding: 16px;
  position: relative;
  overflow: hidden;
}

.live-orb-wrap {
  position: relative;
  width: 38px;
  height: 38px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.live-orb-ring {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 2px solid var(--cyan);
  animation: pulseRing 1.4s ease-in-out infinite;
}

.live-orb-core {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--cyan);
  box-shadow: 0 0 12px var(--cyan);
}

.wave-bars {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  height: 20px;
}

.wave-bar {
  width: 3px;
  height: 18px;
  border-radius: 999px;
  background: var(--cyan);
  transform-origin: center bottom;
  animation: waveBar 0.85s ease-in-out infinite;
}
.wave-bar:nth-child(2) { animation-delay: 0.12s; background: var(--primary); }
.wave-bar:nth-child(3) { animation-delay: 0.24s; }
.wave-bar:nth-child(4) { animation-delay: 0.36s; background: var(--primary); }
.wave-bar:nth-child(5) { animation-delay: 0.48s; }

.progress-fill.live-active {

const API_KEYS_SS_KEY = 'yukisub_translater_api_keys_session_v1';
const API_KEYS_LS_KEY = 'yukisub_translater_api_keys_local_v1';

let dbPromise = null;

function hasIndexedDB() {
  return typeof indexedDB !== 'undefined';

function openDB() {
  if (!hasIndexedDB()) {
    return Promise.resolve(null);
  }
  if (dbPromise) return dbPromise;

  dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (event) => {
      const db = event.target.result;
      if (!db.objectStoreNames.contains(STORES.SETTINGS)) {
        db.createObjectStore(STORES.SETTINGS, { keyPath: 'key' });
      }
      if (!db.objectStoreNames.contains(STORES.SESSIONS)) {
        db.createObjectStore(STORES.SESSIONS, { keyPath: 'sessionId' });
      }
      if (!db.objectStoreNames.contains(STORES.TM)) {
        db.createObjectStore(STORES.TM, { keyPath: 'id' });
      }
      if (!db.objectStoreNames.contains(STORES.GLOSSARY)) {
        db.createObjectStore(STORES.GLOSSARY, { keyPath: 'id' });
      }
      if (!db.objectStoreNames.contains(STORES.PROMPTS)) {
        db.createObjectStore(STORES.PROMPTS, { keyPath: 'id' });
      }
      if (!db.objectStoreNames.contains(STORES.ACTIVITY)) {
        db.createObjectStore(STORES.ACTIVITY, { keyPath: 'id' });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}

async function idbGetAll(storeName) {
  const db = await openDB();
  if (!db) return [];
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readonly');
    const store = tx.objectStore(storeName);
    const req = store.getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}

async function idbGet(storeName, key) {
  const db = await openDB();
  if (!db) return null;
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readonly');
    const store = tx.objectStore(storeName);
    const req = store.get(key);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}

async function idbPut(storeName, value) {
  const db = await openDB();
  if (!db) return value;
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readwrite');
    const store = tx.objectStore(storeName);
    const req = store.put(value);
    req.onsuccess = () => resolve(value);
    req.onerror = () => reject(req.error);
  });
}

async function idbDelete(storeName, key) {
  const db = await openDB();

  return new Promise((resolve, reject) => {

    const req = store.delete(key);

    req.onerror = () => reject(req.error);

    const raw = sessionStorage.getItem(API_KEYS_SS_KEY);

/**
 * Strict SRT Parser & Exporter
 * Preserves subtitle numbering, exact timestamps, original line breaks,
 * subtitle order, and inline formatting.
 */
function parseSRT(rawText) {
  const normalized = rawText.replace(/^\uFEFF/, '');
  const lineEnding = normalized.includes('\r\n') ? '\r\n' : '\n';
  const lines = normalized.replace(/\r\n/g, '\n').split('\n');

  const blocks = [];
  let current = [];

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (line.trim() === '') {
      if (current.length > 0) {
        blocks.push(current);
        current = [];
      }
    } else {
      current.push(line);
    }
  }
  if (current.length > 0) {
    blocks.push(current);
  }

  const entries = [];
  let seqFallback = 1;

  for (const block of blocks) {
    // Find timestamp line (usually index 1, or 0 if index line omitted)
    const tsIdx = block.findIndex((l) =>
      /^\d{1,2}:\d{2}:\d{2}[,.]\d{3}\s*-->\s*\d{1,2}:\d{2}:\d{2}[,.]\d{3}/.test(l.trim())
    );
    if (tsIdx === -1) {
      continue;
    }

    const indexLine = tsIdx > 0 ? block.slice(0, tsIdx).join('\n').trim() : String(seqFallback);
    const timestampLine = block[tsIdx].trim();
    const [startTime, endTimePart] = timestampLine.split(/\s*-->\s*/);
    const textLines = block.slice(tsIdx + 1);
    const originalText = textLines.join('\n');

    entries.push({
      id: `srt_${seqFallback}`,
      entryNumber: indexLine,
      startTime: startTime.trim(),
      endTime: (endTimePart || '').trim(),
      timestampLine,
      originalText,
      translatedText: '',
      status: 'untranslated',
      meta: {
        indexLine,
        timestampLine
      }
    });
    seqFallback++;
  }

  return {
    format: 'srt',
    lineEnding,
    entries,
    metadata: {}
  };
}
function exportSRT(parsed) {
  const eol = parsed.lineEnding || '\n';
  const outBlocks = parsed.entries.map((entry, idx) => {
    const num = entry.meta?.indexLine || entry.entryNumber || String(idx + 1);
    const ts = entry.meta?.timestampLine || `${entry.startTime} --> ${entry.endTime}`;
    const text = entry.translatedText && entry.translatedText.trim() !== ''
      ? entry.translatedText
      : entry.originalText;
    return [num, ts, text.replace(/\r\n/g, '\n')].join('\n');
  });

  return outBlocks.join('\n\n').replace(/\n/g, eol) + eol;
}

    const lines = block.split('\n');
    const firstTrim = lines[0].trim();

    // Preserve NOTE, STYLE, REGION metadata blocks verbatim
    if (
      firstTrim.startsWith('NOTE') ||
      firstTrim.startsWith('STYLE') ||
      firstTrim.startsWith('REGION')

      sequence.push({ type: 'meta', raw: block });
      continue;

    const startTime = arrowParts[0].trim();
    const rightParts = (arrowParts[1] || '').trim().split(/\s+/);
    const endTime = rightParts[0] || '';
    const cueSettings = rightParts.slice(1).join(' ');
    const originalText = lines.slice(tsIdx + 1).join('\n');

    const entry = {
      id: `vtt_${cueCounter}`,
      entryNumber: cueIdentifier || String(cueCounter),
      startTime,
      endTime,
      timestampLine,
      originalText,
      translatedText: '',
      status: 'untranslated',
      meta: {
        cueIdentifier,
        timestampLine,
        cueSettings
      }
    };

    entries.push(entry);
    sequence.push({ type: 'cue', entryId: entry.id });
    cueCounter++;

    format: 'vtt',
    lineEnding,
    entries,
    metadata: {
      headerBlock,
      sequence

      parts.push(item.raw);
      continue;
    }
    const entry = entryMap.get(item.entryId);
    if (!entry) continue;

    const text = entry.translatedText && entry.translatedText.trim() !== ''
      ? entry.translatedText
      : entry.originalText;
    const lines = [];
    if (entry.meta?.cueIdentifier) {
      lines.push(entry.meta.cueIdentifier);
    }
    lines.push(entry.meta?.timestampLine || `${entry.startTime} --> ${entry.endTime}${entry.meta?.cueSettings ? ' ' + entry.meta.cueSettings : ''}`);
    lines.push(text.replace(/\r\n/g, '\n'));

/**

 * - Parses [Script Info], [V4 Styles] / [V4+ Styles], [Events], and extra sections.

 * - NEVER naively splits Dialogue: lines on every comma: splits ONLY up to the
 *   declared Text column index so commas in dialogue remain intact.
 * - Preserves override tags ({\pos(...)}, {\i1}, etc.), styles, layers, margins, effects.

    const commaPos = lineValue.indexOf(',', start);

      fields.push(lineValue.slice(start));
      start = lineValue.length;
      break;
    }
    fields.push(lineValue.slice(start, commaPos));
    start = commaPos + 1;

        endColIndex = formatColumns.findIndex((c) => c.toLowerCase() === 'end');
        styleColIndex = formatColumns.findIndex((c) => c.toLowerCase() === 'style');

        const endTime = endColIndex >= 0 ? (fields[endColIndex] || '').trim() : '';
        const style = styleColIndex >= 0 ? (fields[styleColIndex] || '').trim() : '';

          id: `${ext}_${dialogueCounter}`,
          entryNumber: String(dialogueCounter),
          startTime,
          endTime,
          timestampLine: `${startTime} --> ${endTime}`,
          originalText,
          translatedText: '',
          status: 'untranslated',
          meta: {
            prefix,
            fields,
            textColIndex,
            style,
            actor

/**
 * Subtitle Quality & Script Detectors
 * - Hindi / Urdu combined filter:
 *   Detects Devanagari (\u0900-\u097F), Urdu/Arabic script (\u0600-\u06FF),
 *   or mixed English + Devanagari/Urdu script in dialogue text
 *   (ignoring ASS/SSA {...} override tags, IDs, and timestamps).
 *   Does NOT flag normal English or Roman-script Hinglish.
 * - Suspicious detector:
 *   Highlights broken/missing ASS override tags, script anomalies, or
 *   unbalanced braces. Highlight only—never auto-rewrites text.
 */

const DEVANAGARI_RE = /[\u0900-\u097F]/;
const ARABIC_URDU_RE = /[\u0600-\u06FF]/;
const LATIN_RE = /[A-Za-z]/;
function stripAssOverrideTags(text) {
  return (text || '').replace(/\{[^}]*\}/g, '');
}
function extractAssOverrideTags(text) {
  return (text || '').match(/\{[^}]*\}/g) || [];
}

  const trans = entry?.translatedText || '';
  if (!trans.trim()) return false;
  const cleanOrig = stripAssOverrideTags(entry?.originalText || '').trim();
  const cleanTrans = stripAssOverrideTags(trans).trim();
  if (cleanOrig && !cleanTrans) return false;
  return true;
}
function isHindiOrUrduScriptEntry(entry) {
  const target = entry?.translatedText || '';
  if (!target.trim()) return false;
  const clean = stripAssOverrideTags(target);
  const hasDevanagari = DEVANAGARI_RE.test(clean);
  const hasUrdu = ARABIC_URDU_RE.test(clean);
  // Matches pure Devanagari, pure Urdu/Arabic, or mixed English + Devanagari/Urdu
  return hasDevanagari || hasUrdu;
}
function getSuspiciousReasons(entry, settings = {}) {
  const reasons = [];
  const orig = entry?.originalText || '';
  const trans = entry?.translatedText || '';

  if (!trans.trim()) return reasons;

  // 1. Check unbalanced ASS braces in translated text
  const openCount = (trans.match(/\{/g) || []).length;
  const closeCount = (trans.match(/\}/g) || []).length;
  if (openCount !== closeCount) {
    reasons.push('Unbalanced ASS override braces { }');
  }

  // 2. Check missing ASS override tags that existed in original
  const origTags = extractAssOverrideTags(orig);
  if (origTags.length > 0) {
    const transTags = extractAssOverrideTags(trans);
    for (const tag of origTags) {

        break;

  if (settings.targetLanguage === 'Hinglish' || (settings.targetLanguage === 'Hindi' && settings.romanHinglish)) {
    const clean = stripAssOverrideTags(trans);
    if (DEVANAGARI_RE.test(clean) || ARABIC_URDU_RE.test(clean)) {
      reasons.push('Devanagari/Urdu script detected while Roman Hinglish is enabled');
    }
  }

  // 4. Severe length anomaly (e.g. truncated to 1 char or >6x longer than long source)
  const cleanOrig = stripAssOverrideTags(orig).trim();
  const cleanTrans = stripAssOverrideTags(trans).trim();
  if (cleanOrig.length > 15 && cleanTrans.length <= 2) {
    reasons.push('Abnormally short translation compared to source');
  } else if (cleanOrig.length > 10 && cleanTrans.length > cleanOrig.length * 5) {
    reasons.push('Abnormally long translation compared to source');
  }

  // 5. Unintended mixed-script anomaly if Latin + non-Latin mixed unexpectedly
  if (LATIN_RE.test(cleanTrans) && (DEVANAGARI_RE.test(cleanTrans) || ARABIC_URDU_RE.test(cleanTrans))) {

    }
  }

}

  return getSuspiciousReasons(entry, settings).length > 0;

      .slice(0, 150)

      cleanup();

      cleanup();

    seenIds.add(id);
    if (text.trim() !== '') {
      const origEntry = expectedEntries.find((e) => e.id === id);
      const safeText = origEntry ? preserveAssTagsIfDropped(origEntry.originalText, text) : text;
      validMap.set(id, safeText);
    }
  }

  const missingEntries = expectedEntries.filter((e) => !validMap.has(e.id));
  return { validMap, missingEntries, duplicateIds, unexpectedIds };
}

/**
 * Batch Translation Engine
 * - Uses exact batchSize (15, 25, 40, 50, 100, 150) without auto-resizing.
 * - Preserves successful batches and retries missing/failed entries.
 * - Emits genuine step-by-step status updates.
 */
async function translateFileInBatches(fileRecord) {
  const settings = state.draftSettings;
  if (!settings.selectedModel) {
    throw new Error('No Gemini model selected. Go to Gemini Models and select a live model first.');
  }

  const entriesToProcess = fileRecord.entries.filter((e) => !hasActualTranslation(e));
  if (entriesToProcess.length === 0) {
    throw new Error('All entries in this file are already translated.');
  }

  const exactBatchSize = Number(settings.batchSize) || 25;
  const alreadyTranslated = fileRecord.entries.length - entriesToProcess.length;
  const resumeBatchOffset = Math.floor(alreadyTranslated / exactBatchSize);
  const overallTotalBatches = Math.ceil(fileRecord.entries.length / exactBatchSize);

  const batches = [];
  for (let i = 0; i < entriesToProcess.length; i += exactBatchSize) {
    batches.push(entriesToProcess.slice(i, i + exactBatchSize));
  }

  // Start clean round-robin from API 1 when no other requests are active (and not resuming mid-file)
  if (alreadyTranslated === 0 && state.apiKeys.every((k) => (k.activeRequests || 0) === 0)) {
    state.rrPointer = 0;
  }

  const previousCompletedLogs = (
    state.translationJob.fileId === fileRecord.fileId && Array.isArray(state.translationJob.batchLog)
      ? state.translationJob.batchLog.filter((item) => item.status === 'Completed')
      : []
  );

  const controller = new AbortController();
  state.translationJob = {
    running: true,
    fileId: fileRecord.fileId,
    step: alreadyTranslated > 0 ? `Resuming from Batch ${resumeBatchOffset + 1}` : 'Preparing subtitle batch',
    currentBatch: resumeBatchOffset,
    totalBatches: overallTotalBatches,
    completedEntries: alreadyTranslated,
    totalEntries: fileRecord.entries.length,
    activeKeyLabel: '',
    thoughtSummary: settings.thinkingMode === 'Off' ? 'Thinking Mode is Off.' : `Initializing ${settings.thinkingMode} thinking for Batch ${resumeBatchOffset + 1}...`,
    batchLog: previousCompletedLogs,
    abortController: controller,
    error: ''
  };
  fileRecord.status = 'Translating';
  fileRecord.error = '';
  notify();

  let translatedCount = alreadyTranslated;

  try {
    for (let b = 0; b < batches.length; b++) {
      if (controller.signal.aborted) break;

      const batch = batches[b];
      const displayBatchNum = resumeBatchOffset + b + 1;
      state.translationJob.currentBatch = displayBatchNum;
      state.translationJob.step = 'Preparing subtitle batch';
      notify();

      const { systemInstruction, userContent } = buildTranslationPromptPayload(
        batch,
        fileRecord.entries,
        settings,
        state.glossary,
        state.customPrompts
      );

      state.translationJob.step = 'Connecting to Gemini';
      notify();

      state.translationJob.step = 'Sending subtitle entries';
      const batchLogEntry = {
        batchNum: displayBatchNum,
        entryCount: batch.length,
        keyLabel: 'Assigning...',
        maskedKey: '',
        status: 'Running'
      };
      state.translationJob.batchLog = [...state.translationJob.batchLog, batchLogEntry];
      notify();

      const rawResponse = await callGeminiWithRetry({
        modelId: settings.selectedModel,
        systemInstruction,
        userContent,
        thinkingMode: settings.thinkingMode,
        abortSignal: controller.signal,
        onKeySelected: (kObj, isFailover) => {
          const masked = kObj.key === 'server-side' ? 'Proxy' : maskApiKey(kObj.key);
          const label = `${kObj.label} (${masked})`;
          state.translationJob.activeKeyLabel = label;
          batchLogEntry.keyLabel = isFailover ? `${batchLogEntry.keyLabel} ➔ ${kObj.label}` : kObj.label;
          batchLogEntry.maskedKey = masked;
          notify();
        }
      });

      state.translationJob.step = 'Validating translated subtitle IDs';
      notify();

      let { validMap, missingEntries } = validateBatchResponse(batch, rawResponse);

      // Retry missing entries once while keeping all valid ones
      if (missingEntries.length > 0 && !controller.signal.aborted) {
        const retryPayload = buildTranslationPromptPayload(
          missingEntries,
          fileRecord.entries,
          settings,
          state.glossary,
          state.customPrompts
        );
        try {
          const retryRaw = await callGeminiWithRetry({
            modelId: settings.selectedModel,
            systemInstruction: retryPayload.systemInstruction,
            userContent: retryPayload.userContent,
            thinkingMode: settings.thinkingMode,
            abortSignal: controller.signal
          });
          const retryCheck = validateBatchResponse(missingEntries, retryRaw);
          for (const [k, v] of retryCheck.validMap.entries()) {
            validMap.set(k, v);
          }
          missingEntries = retryCheck.missingEntries;
        } catch {
          // Keep partial success from first pass
        }
      }

      state.translationJob.step = 'Saving translated entries';
      notify();

      for (const entry of batch) {
        if (validMap.has(entry.id)) {
          entry.translatedText = validMap.get(entry.id);
          entry.status = 'translated';
          translatedCount++;
        } else {
          entry.status = 'missing';
        }
      }

      batchLogEntry.status = 'Completed';
      state.translationJob.completedEntries = translatedCount;
      state.translationJob.step = 'Batch completed';
      notify();
    }

    if (controller.signal.aborted) {
      fileRecord.status = 'Cancelled';
      await addActivity('translation', `Cancelled translation for "${fileRecord.filename}"`);
    } else {
      const missingTotal = fileRecord.entries.filter((e) => e.status === 'missing').length;
      fileRecord.status = missingTotal > 0 ? 'Partial' : 'Completed';

      // Save completed session to IndexedDB History
      const historySession = {
        sessionId: fileRecord.sessionId,
        filename: fileRecord.filename,
        format: fileRecord.format,
        sourceLanguage: settings.sourceLanguage,
        targetLanguage: settings.targetLanguage,
        romanHinglish: settings.targetLanguage === 'Hindi' ? Boolean(settings.romanHinglish) : false,
        modelId: settings.selectedModel,
        entryCount: fileRecord.entries.length,
        translatedCount: fileRecord.entries.filter((e) => e.translatedText.trim() !== '').length,
        status: fileRecord.status,
        completedAt: Date.now(),
        entriesSnapshot: fileRecord.entries.map((e) => ({ ...e })),
        metadataSnapshot: fileRecord.metadata,
        lineEnding: fileRecord.lineEnding,
        hasBOM: fileRecord.hasBOM
      };
      await saveHistorySession(historySession);
      state.history = [historySession, ...state.history.filter((h) => h.sessionId !== historySession.sessionId)];
      await addActivity('translation', `Translated "${fileRecord.filename}" (${historySession.translatedCount}/${historySession.entryCount} lines)`);
    }
  } catch (err) {
    if (err?.name === 'AbortError') {
      fileRecord.status = 'Cancelled';
    } else {
      fileRecord.status = 'Error';
      fileRecord.error = err?.message || 'Translation failed';
      state.translationJob.error = fileRecord.error;
    }
  } finally {
    state.translationJob.running = false;
    state.translationJob.abortController = null;
    notify();
  }
}
function cancelActiveTranslation() {
  if (state.translationJob.running && state.translationJob.abortController) {
    state.translationJob.abortController.abort(new Error('Cancelled by user'));
  }
}

/* =========================================================
   MULTI-FILE TRANSLATION QUEUE ENGINE
   ========================================================= */
function enqueueFile(fileId) {
  const q = state.translationQueue;
  if (!state.uploadedFiles.some((f) => f.fileId === fileId)) return false;
  if (q.items.includes(fileId)) return false;
  q.items = [...q.items, fileId];
  delete q.failedMap[fileId];
  q.completedFileIds = q.completedFileIds.filter((id) => id !== fileId);
  notify();
  return true;
}

function dequeueFile(fileId) {
  const q = state.translationQueue;
  if (q.running && q.currentFileId === fileId) return false;
  q.items = q.items.filter((id) => id !== fileId);
  q.completedFileIds = q.completedFileIds.filter((id) => id !== fileId);
  delete q.failedMap[fileId];
  notify();
  return true;
}

function moveQueueItem(fileId, delta) {
  const q = state.translationQueue;
  if (q.running && q.currentFileId === fileId) return false;
  const idx = q.items.indexOf(fileId);
  if (idx === -1) return false;
  const targetIdx = idx + delta;
  if (targetIdx < 0 || targetIdx >= q.items.length) return false;
  if (q.running && q.items[targetIdx] === q.currentFileId) return false;
  const next = [...q.items];
  [next[idx], next[targetIdx]] = [next[targetIdx], next[idx]];
  q.items = next;
  notify();
  return true;
}

function enqueueAllUntranslatedFiles() {
  const q = state.translationQueue;
  let added = 0;
  for (const file of state.uploadedFiles) {
    const hasUntranslated = file.entries.some((e) => !hasActualTranslation(e));
    if (hasUntranslated && !q.items.includes(file.fileId)) {
      q.items.push(file.fileId);
      delete q.failedMap[file.fileId];
      q.completedFileIds = q.completedFileIds.filter((id) => id !== file.fileId);
      added++;
    }
  }
  if (added > 0) notify();
  return added;
}

function clearPendingQueue() {
  const q = state.translationQueue;
  if (q.running && q.currentFileId) {
    q.items = [q.currentFileId];
  } else {
    q.items = [];
    q.completedFileIds = [];
    q.failedMap = {};
    q.paused = false;
    q.stopRequested = false;
  }
  notify();
}

function pauseTranslationQueue() {
  const q = state.translationQueue;
  if (!q.running) return;
  q.paused = true;
  notify();
}

function stopTranslationQueue() {
  const q = state.translationQueue;
  q.stopRequested = true;
  q.paused = false;
  cancelActiveTranslation();
  notify();
}

async function retryFailedQueueItems() {
  const q = state.translationQueue;
  if (q.running) return;
  const failedIds = q.items.filter((id) => {
    const f = state.uploadedFiles.find((u) => u.fileId === id);
    return Boolean(q.failedMap[id]) || (f && f.status === 'Error');
  });
  if (failedIds.length === 0) {
    throw new Error('No failed files in the queue to retry.');
  }
  for (const id of failedIds) {
    delete q.failedMap[id];
    q.completedFileIds = q.completedFileIds.filter((cid) => cid !== id);
    const f = state.uploadedFiles.find((u) => u.fileId === id);
    if (f) {
      f.status = 'Ready';
      f.error = '';
    }
  }
  notify();
  await startTranslationQueue();
}

async function startTranslationQueue() {
  const q = state.translationQueue;
  if (q.running) return;
  if (!state.draftSettings.selectedModel) {
    throw new Error('No Gemini model selected. Go to Gemini Models and select a live model first.');
  }
  // Remove any stale fileIds no longer in uploadedFiles
  const validIds = new Set(state.uploadedFiles.map((f) => f.fileId));
  q.items = q.items.filter((id) => validIds.has(id));
  if (q.items.length === 0) {
    throw new Error('Queue is empty. Add files to the queue first.');
  }

  q.running = true;
  q.paused = false;
  q.stopRequested = false;
  notify();

  await addActivity('queue', `Started translation queue (${q.items.length} file(s))`);

  try {
    let cursor = 0;
    while (cursor < q.items.length) {
      if (q.stopRequested || q.paused) break;

      const fileId = q.items[cursor];
      if (q.completedFileIds.includes(fileId)) {
        cursor++;
        continue;
      }

      const file = state.uploadedFiles.find((f) => f.fileId === fileId);
      if (!file) {
        q.items = q.items.filter((id) => id !== fileId);
        continue;
      }

      const remaining = file.entries.filter((e) => !hasActualTranslation(e)).length;
      if (remaining === 0) {
        if (!q.completedFileIds.includes(fileId)) q.completedFileIds.push(fileId);
        cursor++;
        notify();
        continue;
      }

      q.currentFileId = fileId;
      state.selectedFileId = fileId;
      delete q.failedMap[fileId];
      notify();

      try {
        await translateFileInBatches(file);
        if (file.status === 'Completed' || file.status === 'Partial') {
          if (!q.completedFileIds.includes(fileId)) q.completedFileIds.push(fileId);
          if (q.autoDownload) {
            downloadSubtitleFile(file, state.draftSettings.targetLanguage);
          }
        } else if (file.status === 'Error') {
          q.failedMap[fileId] = file.error || 'Translation failed';
        } else if (file.status === 'Cancelled') {
          q.stopRequested = true;
        }
      } catch (err) {
        q.failedMap[fileId] = err?.message || 'Queue item failed';
      }

      q.currentFileId = null;
      cursor++;
      notify();

      if (!q.stopRequested && !q.paused && cursor < q.items.length) {
        await new Promise((r) => setTimeout(r, 600));
      }
    }
  } finally {
    const wasStopped = q.stopRequested;
    const wasPaused = q.paused;
    q.running = false;
    q.currentFileId = null;
    q.stopRequested = false;
    await addActivity(
      'queue',
      wasStopped
        ? 'Stopped translation queue'
        : wasPaused
          ? 'Paused translation queue'
          : `Finished translation queue (${q.completedFileIds.length}/${q.items.length} completed)`
    );
    notify();
  }
}

/**
 * Individual Fresh Retranslation
 * - Bypasses all caches and Translation Memory.
 * - Uses per-entry requestVersion so stale responses never overwrite newer edits.
 * - Blocks duplicate simultaneous clicks on the same row.
 * - Preserves previous valid translation on failure.
 */
async function retranslateSingleEntry(fileRecord, entryId, customRequestFn = null) {
  const rowKey = `${fileRecord.fileId}::${entryId}`;
  if (state.editor.retranslatingKeys.has(rowKey)) {
    return { skipped: true, reason: 'Already retranslating' };
  }

  const entry = fileRecord.entries.find((e) => e.id === entryId);
  if (!entry) throw new Error('Subtitle entry not found');

  const settings = state.draftSettings;
  if (!customRequestFn && !settings.selectedModel) {
    throw new Error('No Gemini model selected. Select a model in Gemini Models first.');
  }

  const nextVersion = (state.editor.entryRequestVersions.get(rowKey) || 0) + 1;
  state.editor.entryRequestVersions.set(rowKey, nextVersion);
  state.editor.retranslatingKeys.add(rowKey);
  notify();

  const previousTranslation = entry.translatedText;

  try {
    let newText = '';
    if (customRequestFn) {
      newText = await customRequestFn(entry, nextVersion);
    } else {
      const { systemInstruction, userContent } = buildTranslationPromptPayload(
        [entry],
        fileRecord.entries,
        settings,
        state.glossary,
        state.customPrompts
      );

      const raw = await callGeminiWithRetry({
        modelId: settings.selectedModel,
        systemInstruction,
        userContent,
        thinkingMode: settings.thinkingMode
      });

      const { validMap } = validateBatchResponse([entry], raw);
      if (!validMap.has(entry.id)) {
        throw new Error('Model did not return a valid translation for this entry.');
      }
      newText = validMap.get(entry.id);
    }

    // Check version guard: if a newer edit/request happened, discard stale result
    if (state.editor.entryRequestVersions.get(rowKey) !== nextVersion) {
      return { stale: true, version: nextVersion };
    }

    entry.translatedText = newText;
    entry.status = 'translated';
    await addActivity('retranslate', `Retranslated line #${entry.entryNumber} in "${fileRecord.filename}"`);
    return { ok: true, translatedText: newText, version: nextVersion };
  } catch (err) {
    // Preserve previous valid translation on error
    entry.translatedText = previousTranslation;
    throw err;
  } finally {
    state.editor.retranslatingKeys.delete(rowKey);
    notify();
  }
}

/**
 * Fix Word / Hindi-Urdu Script -> Roman Hinglish
 * - Converts any Devanagari/Urdu script words in an existing translated line into
 *   natural conversational Roman-script Hinglish while preserving ASS tags & context.
 * - Uses per-entry requestVersion & duplicate-click lock, bypassing caches and TM.
 */
async function fixHindiUrduLineToHinglish(fileRecord, entryId) {
  const rowKey = `${fileRecord.fileId}::${entryId}`;
  if (state.editor.retranslatingKeys.has(rowKey)) {
    return { skipped: true, reason: 'Already processing' };
  }

  const entry = fileRecord.entries.find((e) => e.id === entryId);
  if (!entry) throw new Error('Subtitle entry not found');

  const settings = state.draftSettings;
  if (!settings.selectedModel) {
    throw new Error('No Gemini model selected. Select a model first.');
  }

  const nextVersion = (state.editor.entryRequestVersions.get(rowKey) || 0) + 1;
  state.editor.entryRequestVersions.set(rowKey, nextVersion);
  state.editor.retranslatingKeys.add(rowKey);
  notify();

  const previousTranslation = entry.translatedText;

  try {
    const systemInstruction = `${DEFAULT_SYSTEM_PROMPT}\n\n${ROMAN_HINGLISH_INSTRUCTION}\n\nSTRICT SCRIPT FIX RULE: You must convert every Devanagari (Hindi) and Urdu/Arabic script word into natural Roman-script Hinglish (Latin alphabet only). Never output Devanagari or Urdu characters. Preserve all ASS/SSA {...} override tags verbatim.`;
    const userContent = JSON.stringify({
      entriesToFix: [
        {
          id: entry.id,
          originalText: entry.originalText,
          currentTranslatedText: entry.translatedText
        }
      ],
      instructions: 'Fix currentTranslatedText by converting any Hindi (Devanagari) or Urdu/Arabic script words into natural spoken Roman Hinglish matching originalText. Return JSON { "translations": [{ "id": string, "translatedText": string }] }.'
    }, null, 2);

    const raw = await callGeminiWithRetry({
      modelId: settings.selectedModel,
      systemInstruction,
      userContent,
      thinkingMode: settings.thinkingMode
    });

    const { validMap } = validateBatchResponse([entry], raw);
    if (!validMap.has(entry.id)) {
      throw new Error('Model did not return a valid Hinglish fix for this entry.');
    }

    if (state.editor.entryRequestVersions.get(rowKey) !== nextVersion) {
      return { stale: true, version: nextVersion };
    }

    const fixedText = validMap.get(entry.id);
    entry.translatedText = fixedText;
    entry.status = 'translated';
    await addActivity('fix-word', `Fixed Hindi/Urdu script to Hinglish on line #${entry.entryNumber}`);
    return { ok: true, translatedText: fixedText, version: nextVersion };
  } catch (err) {
    entry.translatedText = previousTranslation;
    throw err;
  } finally {
    state.editor.retranslatingKeys.delete(rowKey);
    notify();
  }
}


// === tests/testRunner.js ===




function assert(condition, message) {
  if (!condition) {
    throw new Error(message || 'Assertion failed');
  }
}
async function runDiagnosticsSuite() {
  const results = [];

  async function test(name, fn) {
    const start = performance.now();
    try {
      await fn();
      results.push({
        name,
        passed: true,
        durationMs: Math.round(performance.now() - start),
        error: ''
      });
    } catch (err) {
      results.push({
        name,
        passed: false,
        durationMs: Math.round(performance.now() - start),
        error: err?.message || String(err)
      });
    }
  }

  // 1. SRT Round-Trip Test
  await test('SRT parser & exporter preserves numbering, timestamps, and line breaks', async () => {
    const sampleSRT = `1\n00:00:01,000 --> 00:00:03,500\nHello, world!\nHow are you?\n\n2\n00:00:04,000 --> 00:00:06,200\n<i>Good morning!</i>\n`;
    const parsed = parseSubtitleFile('ep01.srt', sampleSRT, sampleSRT.length);
    assert(parsed.entries.length === 2, `Expected 2 entries, got ${parsed.entries.length}`);
    assert(parsed.entries[0].originalText === 'Hello, world!\nHow are you?', 'Line breaks not preserved');
    parsed.entries[0].translatedText = 'Namaste duniya!\nKaise ho?';
    const exported = exportSubtitleFile(parsed);
    assert(exported.includes('00:00:01,000 --> 00:00:03,500'), 'Timestamp missing');
    assert(exported.includes('Namaste duniya!\nKaise ho?'), 'Translated text missing');
    assert(exported.includes('<i>Good morning!</i>'), 'Untranslated fallback missing');
  });

  // 2. VTT Round-Trip Test
  await test('VTT parser & exporter preserves WEBVTT header, NOTE blocks, and cue settings', async () => {
    const sampleVTT = `WEBVTT - Anime Episode\n\nNOTE Metadata block\n\ncue-1\n00:00:01.000 --> 00:00:03.500 align:start position:10%\nWait for me!\n`;
    const parsed = parseSubtitleFile('ep01.vtt', sampleVTT, sampleVTT.length);
    assert(parsed.entries.length === 1, 'Expected 1 VTT cue');
    parsed.entries[0].translatedText = 'Mera intezaar karo!';
    const exported = exportSubtitleFile(parsed);
    assert(exported.startsWith('WEBVTT - Anime Episode'), 'WEBVTT header lost');
    assert(exported.includes('NOTE Metadata block'), 'NOTE block lost');
    assert(exported.includes('align:start position:10%'), 'Cue settings lost');
    assert(exported.includes('Mera intezaar karo!'), 'Translated VTT cue missing');
  });

  // 3. ASS/SSA Round-Trip Test (commas inside dialogue + {\pos} tags)
  await test('ASS/SSA parser preserves commas inside Dialogue text and {\\pos} override tags', async () => {
    const sampleASS = `[Script Info]
Title: YukiSub Test
ScriptType: v4.00+

[V4+ Styles]
Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding
Style: Default,Arial,20,&H00FFFFFF,&H000000FF,&H00000000,&H00000000,0,0,0,0,100,100,0,0,1,2,2,2,10,10,10,1

[Events]

Comment: 0,0:00:00.00,0:00:01.00,Default,,0,0,0,,Keep this comment

    const parsed = parseSubtitleFile('ep01.ass', sampleASS, sampleASS.length);
    assert(parsed.entries.length === 1, `Expected 1 ASS dialogue, got ${parsed.entries.length}`);
    assert(
      parsed.entries[0].originalText === '{\\pos(640,520)}Hey, wait, don\'t go yet, please!',
      `Dialogue with commas was truncated: ${parsed.entries[0].originalText}`
    );
    parsed.entries[0].translatedText = '{\\pos(640,520)}Arre ruko, abhi mat jao, please!';
    const exported = exportSubtitleFile(parsed);
    assert(exported.includes('Keep this comment'), 'Comment line lost');
    assert(exported.includes('Dialogue: 0,0:00:05.00,0:00:08.50,Default,Akira,0,0,0,,{\\pos(640,520)}Arre ruko, abhi mat jao, please!'), 'Exported ASS dialogue malformed');
  });

  // 4. Fresh-upload isolation test
  await test('Fresh-upload isolation creates new fileId, sessionId, and empty translatedText on re-upload', async () => {
    const sample = `1\n00:00:01,000 --> 00:00:02,000\nHello!\n`;

    first.entries[0].translatedText = 'Namaste!';

    assert(first.fileId !== second.fileId, 'fileId must be unique per upload');
    assert(first.sessionId !== second.sessionId, 'sessionId must be unique per upload');
    assert(second.entries[0].translatedText === '', 'Re-uploaded file must have empty translatedText');
  });

  // 5. Individual retranslation versioning & cache bypass
  await test('Individual retranslation enforces requestVersion against stale responses', async () => {
    const sample = `1\n00:00:01,000 --> 00:00:02,000\nLet us go!\n`;
    const fileRec = parseSubtitleFile('ver.srt', sample, sample.length);
    fileRec.entries[0].translatedText = 'Old translation';

    const rowKey = `${fileRec.fileId}::${fileRec.entries[0].id}`;
    // Simulate first call starting, then a newer version bumping before first finishes
    const res = await retranslateSingleEntry(fileRec, fileRec.entries[0].id, async (_entry, ver) => {

      state.editor.entryRequestVersions.set(rowKey, ver + 1);
      return 'Stale response that must be ignored';
    });

    assert(res.stale === true, 'Expected stale response to be detected');
    assert(fileRec.entries[0].translatedText === 'Old translation', 'Stale response overwrote newer translation');
  });

  // 6. Settings save/restore persistence
  await test('Settings save/restore tracks unsaved changes and restores saved values', async () => {
    const prevBatch = state.savedSettings.batchSize;
    const altBatch1 = prevBatch === 100 ? 150 : 100;
    const altBatch2 = prevBatch === 50 ? 25 : 50;

    updateDraftSetting('batchSize', altBatch1);
    assert(hasUnsavedChanges() === true, 'Expected hasUnsavedChanges() to be true');
    restoreSavedSettings();
    assert(state.draftSettings.batchSize === prevBatch, 'restoreSavedSettings did not revert draft');
    assert(hasUnsavedChanges() === false, 'Expected hasUnsavedChanges() to be false after restore');

    // Test full save round-trip
    updateDraftSetting('batchSize', altBatch2);
    const ok = await saveSettings();
    assert(ok === true, 'saveSettings() returned false');
    assert(state.savedSettings.batchSize === altBatch2, 'Saved settings did not update');

    // Restore original batch size
    updateDraftSetting('batchSize', prevBatch);
    await saveSettings();
  });

  // 7. Per-batch API key rotation (Batch 1->API 1, Batch 2->API 2, Batch 3->API 3, Batch 4->API 1)
  await test('API key load balancer rotates Batch 1->Key 1, Batch 2->Key 2, Batch 3->Key 3, Batch 4->Key 1', async () => {
    const prevKeys = state.apiKeys;
    const prevPtr = state.rrPointer;
    state.apiKeys = [
      { id: 'k1', label: 'API 1', key: 'AIzaTestKey1111', enabled: true, status: 'Valid', activeRequests: 0, cooldownUntil: 0 },
      { id: 'k2', label: 'API 2', key: 'AIzaTestKey2222', enabled: true, status: 'Valid', activeRequests: 0, cooldownUntil: 0 },
      { id: 'k3', label: 'API 3', key: 'AIzaTestKey3333', enabled: true, status: 'Valid', activeRequests: 0, cooldownUntil: 0 }
    ];
    state.rrPointer = 0;

    const picked = [];
    for (let b = 0; b < 4; b++) {
      const k = acquireKey();
      picked.push(k.label);
      releaseKey(k.id, { ok: true });
    }

    state.apiKeys = prevKeys;
    state.rrPointer = prevPtr;

    assert(
      picked.join(',') === 'API 1,API 2,API 3,API 1',
      `Expected API 1,API 2,API 3,API 1 but got ${picked.join(',')}`
    );
  });

  // 8. Resume translation skips completed batches and only processes remaining entries
  await test('Resume translation skips already-translated batches and continues from remaining entries', async () => {
    const srt = [1, 2, 3, 4].map((i) => `${i}\n00:00:0${i},000 --> 00:00:0${i},500\nLine ${i}`).join('\n\n');
    const fileRec = parseSubtitleFile('resume.srt', srt, srt.length);
    // Mark first 2 entries (Batch 1 of size 2) as already translated
    fileRec.entries[0].translatedText = 'Pehli line';
    fileRec.entries[1].translatedText = 'Doosri line';

    const remaining = fileRec.entries.filter((e) => !e.translatedText || e.translatedText.trim() === '');
    assert(remaining.length === 2, `Expected 2 remaining entries, got ${remaining.length}`);
    assert(remaining[0].entryNumber === '3' && remaining[1].entryNumber === '4', 'Resume did not skip completed entries');
  });

  // 9. Untranslated filter includes empty, missing, and tag-only entries
  await test('Untranslated filter includes empty, missing, and tag-only entries', async () => {
    const sample = [
      { id: '1', originalText: 'Hello!', translatedText: '', status: 'untranslated' },
      { id: '2', originalText: 'Wait!', translatedText: '', status: 'missing' },
      { id: '3', originalText: '{\\i1}Run!{\\i0}', translatedText: '{\\i1}{\\i0}', status: 'translated' },
      { id: '4', originalText: 'Thanks', translatedText: 'Shukriya', status: 'translated' }
    ];
    const untrans = sample.filter((e) => entryMatchesFilter(e, 'Untranslated', state.draftSettings));
    assert(untrans.length === 3, `Expected 3 untranslated entries, got ${untrans.length}`);
    const trans = sample.filter((e) => entryMatchesFilter(e, 'Translated', state.draftSettings));
    assert(trans.length === 1 && trans[0].id === '4', 'Translated filter did not match only translated entry');
  });

  // 10. Queue system enqueue, deduplication, reorder, and dequeue
  await test('Translation queue supports enqueue, deduplication, reorder, and dequeue', async () => {
    const prevFiles = state.uploadedFiles;
    const prevQueue = { ...state.translationQueue, items: [...state.translationQueue.items], completedFileIds: [...state.translationQueue.completedFileIds], failedMap: { ...state.translationQueue.failedMap } };

    const f1 = parseSubtitleFile('q1.srt', '1\n00:00:01,000 --> 00:00:02,000\nOne\n', 30);
    const f2 = parseSubtitleFile('q2.srt', '1\n00:00:01,000 --> 00:00:02,000\nTwo\n', 30);
    state.uploadedFiles = [f1, f2];
    state.translationQueue.items = [];
    state.translationQueue.running = false;

    assert(enqueueFile(f1.fileId) === true, 'Failed to enqueue f1');
    assert(enqueueFile(f1.fileId) === false, 'Duplicate enqueue should return false');
    assert(enqueueFile(f2.fileId) === true, 'Failed to enqueue f2');
    assert(moveQueueItem(f2.fileId, -1) === true, 'Failed to move f2 up');
    assert(state.translationQueue.items[0] === f2.fileId, 'Queue reorder failed');
    assert(dequeueFile(f1.fileId) === true, 'Failed to dequeue f1');
    assert(state.translationQueue.items.length === 1, 'Expected 1 item after dequeue');

    state.uploadedFiles = prevFiles;
    state.translationQueue = prevQueue;
  });

  // 11. 503 High Demand error does not penalize or cooldown API keys
  await test('503 high demand server overload does not put API keys into cooldown', async () => {
    assert(isServerOverloadError(503, 'This model is currently experiencing high demand.') === true, 'Expected 503 to be detected as server overload');
    const prevKeys = state.apiKeys;
    state.apiKeys = [
      { id: 'k503', label: 'API 1', key: 'AIzaTest503Key', enabled: true, status: 'Valid', activeRequests: 1, cooldownUntil: 0, lastError: '' }
    ];
    releaseKey('k503', { ok: false, serverOverload: true, statusCode: 503, message: 'High demand' });
    const k = state.apiKeys[0];
    const okStatus = k.status === 'Valid' && k.cooldownUntil === 0 && k.activeRequests === 0;
    state.apiKeys = prevKeys;
    assert(okStatus, 'API key should remain Valid with 0 cooldown after 503 overload');
  });

  // 12. Export filename preserves exact .ass / .srt / .vtt extension without .txt suffix
  await test('Export filename preserves exact .ass/.srt/.vtt extension', async () => {
    assert(buildExportFilename('episode01.ass', 'Hinglish') === 'episode01.hinglish.ass', 'ASS extension not preserved');
    assert(buildExportFilename('movie.srt', 'Hindi') === 'movie.hindi.srt', 'SRT extension not preserved');
    assert(buildExportFilename('clip.vtt', 'Hinglish') === 'clip.hinglish.vtt', 'VTT extension not preserved');
  });

  const passedCount = results.filter((r) => r.passed).length;
  return {
    total: results.length,
    passed: passedCount,
    failed: results.length - passedCount,
    ranAt: Date.now(),
    results
  };
}

// === js/ui/components.js ===
function escapeHtml(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}
function formatBytes(bytes) {
  if (!bytes || bytes <= 0) return '0 B';
  const units = ['B', 'KB', 'MB', 'GB'];
  const i = Math.min(units.length - 1, Math.floor(Math.log(bytes) / Math.log(1024)));
  const val = bytes / Math.pow(1024, i);
  return `${val.toFixed(i === 0 ? 0 : 1)} ${units[i]}`;
}
function formatDateTime(ts) {
  if (!ts) return '—';
  try {
    return new Date(ts).toLocaleString();
  } catch {
    return String(ts);
  }
}
function showToast(message, type = 'info') {
  const container = document.getElementById('toast-container');
  if (!container) return;
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = message;
  container.appendChild(el);
  setTimeout(() => {
    el.remove();
  }, 3600);
}
function showConfirmModal({ title, message, confirmLabel = 'Confirm', danger = false }) {
  return new Promise((resolve) => {
    const root = document.getElementById('modal-root');
    if (!root) {
      resolve(false);
      return;
    }

    root.innerHTML = `
      <div class="modal-backdrop" id="confirm-modal-backdrop">
        <div class="modal-card stack-md" role="dialog" aria-modal="true">
          <div class="row-between">
            <h3 class="card-title">${escapeHtml(title)}</h3>
          </div>
          <p style="margin:0;color:var(--text-muted);">${escapeHtml(message)}</p>
          <div class="row-wrap" style="justify-content:flex-end;margin-top:8px;">
            <button type="button" class="btn btn-secondary" id="modal-cancel-btn">Cancel</button>
            <button type="button" class="btn ${danger ? 'btn-danger' : 'btn-primary'}" id="modal-ok-btn">${escapeHtml(confirmLabel)}</button>
          </div>
        </div>
      </div>
    `;

    const cleanup = (result) => {
      root.innerHTML = '';
      resolve(result);
    };

    root.querySelector('#modal-cancel-btn')?.addEventListener('click', () => cleanup(false));
    root.querySelector('#modal-ok-btn')?.addEventListener('click', () => cleanup(true));
    root.querySelector('#confirm-modal-backdrop')?.addEventListener('click', (e) => {
      if (e.target.id === 'confirm-modal-backdrop') cleanup(false);
    });
  });
}
function showInfoModal({ title, bodyHtml }) {

  root.querySelector('#info-modal-close')?.addEventListener('click', close);
  root.querySelector('#info-modal-backdrop')?.addEventListener('click', (e) => {

}
async function copyToClipboard(text) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch {
    // Fallback below
  }
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  const ok = document.execCommand('copy');
  document.body.removeChild(ta);
  return ok;
}

   ========================================================= */
async function handleIncomingFiles(fileList) {
  const files = Array.from(fileList || []);
  if (!files.length) return;

  let added = 0;
  for (const f of files) {
    try {
      const content = await f.text();
      // Fresh-upload isolation: new fileId, new sessionId, empty translatedText
      const parsed = parseSubtitleFile(f.name, content, f.size);
      state.uploadedFiles.push(parsed);
      if (!state.selectedFileId) {
        state.selectedFileId = parsed.fileId;
      }
      added++;
      await addActivity('upload', `Uploaded "${f.name}" (${parsed.entries.length} entries)`);
    } catch (err) {
      showToast(err?.message || `Failed to parse ${f.name}`, 'error');
    }
  }

  if (added > 0) {
    showToast(`Added ${added} subtitle file(s) with fresh blank sessions.`, 'success');
    notify();
  }
}
