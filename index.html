        </div>

        <div class="dropzone" id="subtitle-dropzone">
          <div style="font-weight:600;font-size:15px;">Drag & drop subtitle files here, or click to browse</div>
          <div class="text-sm text-muted" style="margin-top:6px;">Supports multiple .srt, .vtt, .ass, and .ssa files</div>
          <input type="file" id="subtitle-file-input" class="hidden" multiple />
        </div>

        ${state.uploadedFiles.length === 0 ? `
          <div class="empty-state">No subtitle files uploaded yet.</div>
        ` : `
          <div class="stack-sm">
            ${state.uploadedFiles.map((file) => {
              const prog = getFileProgress(file);
              const isSelected = file.fileId === state.selectedFileId;
              const qIdx = state.translationQueue.items.indexOf(file.fileId);
              const inQueue = qIdx !== -1;
              const isQueueRunningThis = state.translationQueue.running && state.translationQueue.currentFileId === file.fileId;
              return `
                <div class="file-row ${isSelected ? 'selected' : ''}">
                  <div style="min-width:220px;flex:1;">
                    <div class="row-wrap">
                      <span style="font-weight:600;">${escapeHtml(file.filename)}</span>
                      <span class="badge badge-cyan">${escapeHtml(file.format.toUpperCase())}</span>
                      <span class="badge badge-muted">${formatBytes(file.size)}</span>
                      <span class="badge badge-blue">${prog.translated}/${prog.total} translated</span>
                      ${prog.untranslated > 0 ? `<button type="button" class="badge badge-warning badge-clickable" data-view-untranslated="${file.fileId}" title="Open Subtitle Editor filtered to Untranslated lines">${prog.untranslated} untranslated</button>` : ''}
                      ${inQueue ? `<span class="badge badge-cyan">Queue #${qIdx + 1}</span>` : ''}
                      <span class="badge ${file.status === 'Error' ? 'badge-danger' : file.status === 'Completed' ? 'badge-success' : 'badge-muted'}">${escapeHtml(file.status)}</span>
                    </div>
                    ${file.error ? `<div class="text-sm" style="color:#FCA5A5;margin-top:4px;">${escapeHtml(file.error)}</div>` : ''}
                    <div class="progress-wrap" style="margin-top:8px;">
                      <div class="progress-track">
                        <div class="progress-fill ${prog.pct > 0 ? 'has-progress' : ''} ${file.status === 'Translating' ? 'live-active' : ''}" style="width:${prog.pct}%;"></div>
                      </div>
                      <span class="progress-pct">${prog.pct}%</span>
                    </div>
                  </div>
                  <div class="row-wrap">
                    <button type="button" class="btn ${inQueue ? 'btn-cyan' : 'btn-secondary'} btn-sm" data-toggle-queue="${file.fileId}" ${isQueueRunningThis ? 'disabled' : ''}>
                      ${isQueueRunningThis ? 'Running...' : inQueue ? 'Remove Queue' : '+ Queue'}
                    </button>
                    <button type="button" class="btn ${isSelected ? 'btn-primary' : 'btn-secondary'} btn-sm" data-select-file="${file.fileId}">
                      ${isSelected ? 'Active File' : 'Select'}
                    </button>
                    <button type="button" class="btn btn-secondary btn-sm" data-edit-file="${file.fileId}">Editor</button>
                    <button type="button" class="btn btn-danger btn-sm" data-remove-file="${file.fileId}" ${isQueueRunningThis ? 'disabled' : ''}>Remove</button>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `}
      </div>

      ${(() => {
        const q = state.translationQueue;
        const queuedFiles = q.items
          .map((id) => state.uploadedFiles.find((f) => f.fileId === id))
          .filter(Boolean);
        const totalQueueEntries = queuedFiles.reduce((acc, f) => acc + f.entries.length, 0);
        const doneQueueEntries = queuedFiles.reduce((acc, f) => acc + getFileProgress(f).translated, 0);
        const queuePct = totalQueueEntries > 0 ? Math.round((doneQueueEntries / totalQueueEntries) * 100) : 0;
        const completedCount = queuedFiles.filter((f) => q.completedFileIds.includes(f.fileId) || getFileProgress(f).untranslated === 0).length;
        const failedCount = queuedFiles.filter((f) => Boolean(q.failedMap[f.fileId])).length;
        return `
          <div class="card stack-md">
            <div class="row-between">
              <div>
                <h2 class="card-title">Translation Queue <span class="badge ${q.running ? 'badge-cyan' : 'badge-muted'}">${q.running ? (q.paused ? 'Pausing...' : 'Running') : `${queuedFiles.length} Queued`}</span></h2>
                <p class="card-subtitle">Multiple files ko line-by-line automatically ek ke baad ek translate karo.</p>
              </div>
              <div class="row-wrap">
                <label class="row-wrap text-sm" style="cursor:pointer;">
                  <input type="checkbox" id="queue-auto-dl" ${q.autoDownload ? 'checked' : ''} />
                  <span>Auto-Download Done</span>
                </label>
                <button type="button" class="btn btn-secondary btn-sm" id="btn-queue-all" ${state.uploadedFiles.length === 0 ? 'disabled' : ''}>Queue All Ready</button>
                ${q.running ? `
                  <button type="button" class="btn btn-secondary btn-sm" id="btn-queue-pause" ${q.paused ? 'disabled' : ''}>${q.paused ? 'Pausing After File...' : 'Pause After File'}</button>
                  <button type="button" class="btn btn-danger btn-sm" id="btn-queue-stop">Stop Queue</button>
                ` : `
                  <button type="button" class="btn btn-primary btn-sm" id="btn-queue-start" ${queuedFiles.length === 0 || job.running ? 'disabled' : ''}>${q.paused ? 'Resume Queue' : 'Start Queue'}</button>
                  ${failedCount > 0 ? `<button type="button" class="btn btn-cyan btn-sm" id="btn-queue-retry-failed" ${job.running ? 'disabled' : ''}>Retry Failed (${failedCount})</button>` : ''}
                  ${queuedFiles.length > 0 ? `<button type="button" class="btn btn-danger btn-sm" id="btn-queue-clear">Clear Queue</button>` : ''}
                `}
              </div>
            </div>

            ${queuedFiles.length === 0 ? `
              <div class="empty-state">Queue khaali hai. Upar files par <strong>+ Queue</strong> ya <strong>Queue All Ready</strong> click karo.</div>
            ` : `
              <div class="stack-sm">
                <div class="row-between text-sm text-muted">
                  <span>Overall Queue Progress: <strong>${completedCount}/${queuedFiles.length} files</strong>${failedCount > 0 ? ` • <span style="color:#FCA5A5;">${failedCount} failed</span>` : ''}</span>
                  <span>${doneQueueEntries} / ${totalQueueEntries} lines</span>
                </div>
                <div class="progress-wrap">
                  <div class="progress-track">
                    <div class="progress-fill ${queuePct > 0 ? 'has-progress' : ''} ${q.running ? 'live-active' : ''}" style="width:${queuePct}%;"></div>
                  </div>
                  <span class="progress-pct">${queuePct}%</span>
                </div>
                <div class="queue-list">
                  ${queuedFiles.map((f, idx) => {
                    const fp = getFileProgress(f);
                    const isCurrent = q.running && q.currentFileId === f.fileId;
                    const isDone = q.completedFileIds.includes(f.fileId) || fp.untranslated === 0;
                    const errMsg = q.failedMap[f.fileId] || '';
                    const rowClass = isCurrent ? 'queue-active' : errMsg ? 'queue-failed' : isDone ? 'queue-done' : '';
                    const statusBadge = isCurrent
                      ? '<span class="badge badge-cyan">Translating...</span>'
                      : errMsg
                        ? '<span class="badge badge-danger">Failed</span>'
                        : isDone
                          ? '<span class="badge badge-success">Done</span>'
                          : '<span class="badge badge-muted">Pending</span>';
                    return `
                      <div class="queue-item ${rowClass}">
                        <div class="row-wrap" style="flex:1;min-width:200px;">
                          <span class="queue-pos">#${idx + 1}</span>
                          <div>
                            <div style="font-weight:600;">${escapeHtml(f.filename)} <span class="badge badge-muted">${escapeHtml(f.format.toUpperCase())}</span></div>
                            <div class="text-sm text-muted">${fp.translated}/${fp.total} lines (${fp.pct}%)${errMsg ? ` • <span style="color:#FCA5A5;">${escapeHtml(errMsg)}</span>` : ''}</div>
                          </div>
                        </div>
                        <div class="row-wrap">
                          ${statusBadge}
                          <button type="button" class="btn btn-secondary btn-sm" data-queue-up="${f.fileId}" ${idx === 0 || isCurrent ? 'disabled' : ''} title="Move Up">↑</button>
                          <button type="button" class="btn btn-secondary btn-sm" data-queue-down="${f.fileId}" ${idx === queuedFiles.length - 1 || isCurrent ? 'disabled' : ''} title="Move Down">↓</button>
                          <button type="button" class="btn btn-danger btn-sm" data-queue-remove="${f.fileId}" ${isCurrent ? 'disabled' : ''} title="Remove from Queue">×</button>
                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>
              </div>
            `}
          </div>
        `;
      })()}

      <div class="card stack-md">
        <div class="row-between">
          <div>
            <h2 class="card-title">Translation Controls</h2>
            <p class="card-subtitle">
              Active File: <strong>${selectedFile ? escapeHtml(selectedFile.filename) : 'None selected'}</strong>
              • Model: <strong>${escapeHtml(s.selectedModel || 'Not selected')}</strong>
              • Target: <strong>${escapeHtml(s.targetLanguage)}${s.targetLanguage === 'Hindi' && s.romanHinglish ? ' (Roman Hinglish)' : ''}</strong>
            </p>
          </div>
          <div class="row-wrap">
            ${job.running ? `
              <button type="button" class="btn btn-danger" id="btn-cancel-translate">Cancel Translation</button>
            ` : `
              <button type="button" class="btn btn-primary" id="btn-start-translate" ${!selectedFile ? 'disabled' : ''}>
                ${selectedFile && getFileProgress(selectedFile).translated > 0 && getFileProgress(selectedFile).translated < getFileProgress(selectedFile).total
                  ? `Resume Translation (${getFileProgress(selectedFile).total - getFileProgress(selectedFile).translated} left)`
                  : 'Start Batch Translation'}
              </button>
            `}
            <button type="button" class="btn btn-cyan" id="btn-export-download" ${!selectedFile ? 'disabled' : ''}>Download Export</button>
          </div>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label class="form-label" for="tr-source-lang">Source Language</label>
            <select id="tr-source-lang" class="select">
              ${SOURCE_LANGUAGES.map((l) => `<option value="${l}" ${s.sourceLanguage === l ? 'selected' : ''}>${l}</option>`).join('')}
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="tr-target-lang">Target Language</label>
            <select id="tr-target-lang" class="select">
              ${SUPPORTED_LANGUAGES.map((l) => `<option value="${l}" ${s.targetLanguage === l ? 'selected' : ''}>${l}</option>`).join('')}
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="tr-model-select">Gemini Model</label>
            <div class="row-wrap" style="flex-wrap:nowrap;">
              <select id="tr-model-select" class="select" style="flex:1;min-width:0;">
                ${state.models.length === 0
                  ? `<option value="${escapeHtml(s.selectedModel || '')}">${escapeHtml(s.selectedModel || 'No live models fetched yet')}</option>`
                  : `
                    ${!s.selectedModel ? `<option value="">-- Select a live model --</option>` : ''}
                    ${s.selectedModel && !state.models.some((m) => m.id === s.selectedModel)
                      ? `<option value="${escapeHtml(s.selectedModel)}" selected>${escapeHtml(s.selectedModel)}</option>`
                      : ''}
                    ${state.models.map((m) => `<option value="${escapeHtml(m.id)}" ${s.selectedModel === m.id ? 'selected' : ''}>${escapeHtml(m.displayName || m.id)} (${escapeHtml(m.id)})</option>`).join('')}
                  `
                }
              </select>
              <button type="button" class="btn btn-secondary btn-sm" id="tr-fetch-models" ${state.modelsLoading ? 'disabled' : ''}>
                ${state.modelsLoading ? '...' : 'Fetch'}
              </button>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="tr-thinking-mode">Thinking Mode</label>
            <div class="row-wrap" style="flex-wrap:nowrap;">
              <label class="btn ${s.thinkingMode !== 'Off' ? 'btn-cyan' : 'btn-secondary'} btn-sm" style="cursor:pointer;">
                <input type="checkbox" id="tr-thinking-toggle" ${s.thinkingMode !== 'Off' ? 'checked' : ''} style="margin-right:4px;" />
                ${s.thinkingMode !== 'Off' ? 'On' : 'Off'}
              </label>
              <select id="tr-thinking-mode" class="select" style="flex:1;min-width:0;">
                ${THINKING_LEVELS.map((lvl) => `<option value="${lvl}" ${s.thinkingMode === lvl ? 'selected' : ''}>${lvl}${lvl === 'Medium' ? ' (Default)' : ''}</option>`).join('')}
              </select>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="tr-batch-size">Exact Batch Size</label>
            <select id="tr-batch-size" class="select">
              ${BATCH_SIZES.map((sz) => `<option value="${sz}" ${Number(s.batchSize) === sz ? 'selected' : ''}>${sz} entries / batch</option>`).join('')}
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="tr-prev-ctx">Previous Context Lines (Read-Only)</label>
            <input id="tr-prev-ctx" type="number" min="0" max="15" class="input" value="${s.prevContextLines}" />
          </div>
          <div class="form-group">
            <label class="form-label" for="tr-next-ctx">Next Context Lines (Read-Only)</label>
            <input id="tr-next-ctx" type="number" min="0" max="15" class="input" value="${s.nextContextLines}" />
          </div>
        </div>

        ${job.running || job.step ? `
          <div class="live-pipeline-card stack-sm">
            <div class="row-between">
              <div class="row-wrap">
                ${job.running ? `
                  <div class="hud-spinner" aria-hidden="true">
                    <svg width="38" height="38" viewBox="0 0 38 38" fill="none">
                      <circle class="hud-arc-outer" cx="19" cy="19" r="16" stroke="#22D3EE" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="28 14 10 14" />
                      <circle class="hud-arc-inner" cx="19" cy="19" r="11" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" stroke-dasharray="16 10" />
                      <path class="hud-core-star" d="M19 13.5L20.4 17.6L24.5 19L20.4 20.4L19 24.5L17.6 20.4L13.5 19L17.6 17.6L19 13.5Z" fill="#22D3EE" />
                    </svg>
                  </div>
                ` : ''}
                <div>
                  <div class="row-wrap">
                    <span id="live-pipeline-step-text" style="font-weight:700;font-size:14px;">${escapeHtml(job.step || 'Idle')}</span>
                    ${job.running ? `<span class="stream-pill">LIVE</span>` : ''}
                  </div>
                  <div class="text-sm text-muted">Batch ${job.currentBatch} of ${job.totalBatches} • ${job.completedEntries} / ${job.totalEntries} lines</div>
                </div>
              </div>
              <div class="row-wrap">
                <span class="badge badge-blue">Thinking: ${escapeHtml(s.thinkingMode)}${supportsThinking(s.selectedModel) ? '' : ' (N/A on model)'}</span>
                ${job.activeKeyLabel ? `<span class="badge badge-cyan key-badge-live">Active API: ${escapeHtml(job.activeKeyLabel)}</span>` : ''}
              </div>
            </div>

            <div class="progress-wrap">
              <div class="progress-track">
                <div class="progress-fill ${(job.totalEntries > 0 && job.completedEntries > 0) ? 'has-progress' : ''} ${job.running ? 'live-active' : ''}" style="width:${job.totalEntries > 0 ? Math.round((job.completedEntries / job.totalEntries) * 100) : 0}%;"></div>
              </div>
              <span class="progress-pct">${job.totalEntries > 0 ? Math.round((job.completedEntries / job.totalEntries) * 100) : 0}%</span>
            </div>

            <div class="tg-quote" style="max-height:140px;overflow-y:auto;">
              <div class="text-sm text-cyan" style="font-weight:700;margin-bottom:4px;">AI Thinking (${escapeHtml(s.thinkingMode)})</div>
              <div class="text-sm">${escapeHtml(
                s.thinkingMode === 'Off'
                  ? 'Thinking Mode is Off.'
                  : (job.thoughtSummary || (job.running ? `Analyzing dialogue context, glossary & Hinglish tone for Batch ${job.currentBatch}...` : 'Waiting for next batch...'))
              )}</div>
            </div>

            ${job.batchLog && job.batchLog.length > 0 ? `
              <div class="stack-sm" style="margin-top:6px;max-height:150px;overflow-y:auto;">
                ${job.batchLog.map((b) => `
                  <div class="row-between text-sm" style="padding:5px 10px;background:var(--bg-base);border-radius:6px;border:1px solid var(--border-subtle);">
                    <span><strong>Batch ${b.batchNum}</strong> (${b.entryCount} lines) → <span class="text-cyan">${escapeHtml(b.keyLabel)}</span> ${b.maskedKey ? `<span class="mono text-muted">(${escapeHtml(b.maskedKey)})</span>` : ''}</span>
                    <span class="badge ${b.status === 'Completed' ? 'badge-success' : 'badge-cyan'}">${escapeHtml(b.status)}</span>
                  </div>
                `).join('')}
              </div>
            ` : ''}
            ${job.error ? `<div class="text-sm" style="color:#FCA5A5;">${escapeHtml(job.error)}</div>` : ''}
          </div>
        ` : ''}
      </div>
    </div>
  `;

  const fileInput = container.querySelector('#subtitle-file-input');
  const dropzone = container.querySelector('#subtitle-dropzone');

  container.querySelector('#btn-upload-more')?.addEventListener('click', () => fileInput?.click());
  dropzone?.addEventListener('click', () => fileInput?.click());
  fileInput?.addEventListener('change', (e) => {
    handleIncomingFiles(e.target.files);
    e.target.value = '';
  });

  dropzone?.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropzone.classList.add('drag-over');
  });
  dropzone?.addEventListener('dragleave', () => dropzone.classList.remove('drag-over'));
  dropzone?.addEventListener('drop', (e) => {
    e.preventDefault();
    dropzone.classList.remove('drag-over');
    handleIncomingFiles(e.dataTransfer.files);
  });

  container.querySelector('#btn-clear-uploads')?.addEventListener('click', async () => {
    if (state.translationQueue.running || state.translationJob.running) {
      showToast('Stop the active translation/queue before clearing files.', 'warning');
      return;
    }
    const ok = await showConfirmModal({
      title: 'Clear All Uploaded Files?',
      message: 'This removes all active uploaded files, clears the queue, and discards unsaved in-memory translations. Saved Settings and History will not be affected.',
      confirmLabel: 'Clear All',
      danger: true
    });
    if (!ok) return;
    state.uploadedFiles = [];
    state.selectedFileId = null;
    clearPendingQueue();
    notify();
  });

  container.querySelectorAll('[data-view-untranslated]').forEach((btn) => {
    btn.addEventListener('click', () => {
      state.selectedFileId = btn.dataset.viewUntranslated;
      state.editor.filter = 'Untranslated';
      state.editor.search = '';
      state.editor.page = 1;
      navigateTo('editor');
    });
  });

  container.querySelectorAll('[data-toggle-queue]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.toggleQueue;
      if (state.translationQueue.items.includes(id)) {
        dequeueFile(id);
        showToast('Removed file from queue.', 'info');
      } else {
        enqueueFile(id);
        showToast('Added file to queue.', 'success');
      }
    });
  });

  container.querySelector('#queue-auto-dl')?.addEventListener('change', (e) => {
    state.translationQueue.autoDownload = e.target.checked;
    notify();
  });

  container.querySelector('#btn-queue-all')?.addEventListener('click', () => {
    const added = enqueueAllUntranslatedFiles();
    showToast(
      added > 0 ? `Added ${added} file(s) to translation queue.` : 'All ready files are already in queue or fully translated.',
      added > 0 ? 'success' : 'info'
    );
  });

  container.querySelector('#btn-queue-start')?.addEventListener('click', async () => {
    try {
      await startTranslationQueue();
      showToast('Translation queue finished.', 'success');
    } catch (err) {
      showToast(err?.message || 'Queue failed', 'error');
    }
  });

  container.querySelector('#btn-queue-retry-failed')?.addEventListener('click', async () => {
    try {
      await retryFailedQueueItems();
      showToast('Finished retrying failed queue files.', 'success');
    } catch (err) {
      showToast(err?.message || 'Retry failed', 'error');
    }
  });

  container.querySelector('#btn-queue-pause')?.addEventListener('click', () => {
    pauseTranslationQueue();
    showToast('Queue will pause after the current file finishes.', 'warning');
  });

  container.querySelector('#btn-queue-stop')?.addEventListener('click', () => {
    stopTranslationQueue();
    showToast('Stopping translation queue...', 'warning');
  });

  container.querySelector('#btn-queue-clear')?.addEventListener('click', () => {
    clearPendingQueue();
    showToast('Cleared translation queue.', 'info');
  });

  container.querySelectorAll('[data-queue-up]').forEach((btn) => {
    btn.addEventListener('click', () => moveQueueItem(btn.dataset.queueUp, -1));
  });
  container.querySelectorAll('[data-queue-down]').forEach((btn) => {
    btn.addEventListener('click', () => moveQueueItem(btn.dataset.queueDown, 1));
  });
  container.querySelectorAll('[data-queue-remove]').forEach((btn) => {
    btn.addEventListener('click', () => dequeueFile(btn.dataset.queueRemove));
  });

  container.querySelectorAll('[data-select-file]').forEach((btn) => {
    btn.addEventListener('click', () => {
      state.selectedFileId = btn.dataset.selectFile;
      state.editor.page = 1;
      notify();
    });
  });

  container.querySelectorAll('[data-edit-file]').forEach((btn) => {
    btn.addEventListener('click', () => {
      state.selectedFileId = btn.dataset.editFile;
      state.editor.page = 1;
      navigateTo('editor');
    });
  });

  container.querySelectorAll('[data-remove-file]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.removeFile;
      dequeueFile(id);
      state.uploadedFiles = state.uploadedFiles.filter((f) => f.fileId !== id);
      if (state.selectedFileId === id) {
        state.selectedFileId = state.uploadedFiles[0]?.fileId || null;
      }
      notify();
    });
  });

  container.querySelector('#tr-source-lang')?.addEventListener('change', (e) => {
    updateDraftSetting('sourceLanguage', e.target.value);
  });
  container.querySelector('#tr-target-lang')?.addEventListener('change', (e) => {
    updateDraftSetting('targetLanguage', e.target.value);
  });
  container.querySelector('#tr-model-select')?.addEventListener('change', (e) => {
    if (e.target.value) {
      updateDraftSetting('selectedModel', e.target.value);
      showToast(`Selected ${e.target.value}`, 'info');
    }
  });
  container.querySelector('#tr-fetch-models')?.addEventListener('click', async () => {
    await fetchLiveModels();
  });
  container.querySelector('#tr-thinking-toggle')?.addEventListener('change', (e) => {
    const nextMode = e.target.checked ? 'Medium' : 'Off';
    updateDraftSetting('thinkingMode', nextMode);
    showToast(`Thinking Mode ${nextMode === 'Off' ? 'Off' : 'On (Medium)'}`, 'info');
  });
  container.querySelector('#tr-thinking-mode')?.addEventListener('change', (e) => {
    updateDraftSetting('thinkingMode', e.target.value);
    showToast(`Thinking Mode: ${e.target.value}`, 'info');
  });
  container.querySelector('#tr-batch-size')?.addEventListener('change', (e) => {
    updateDraftSetting('batchSize', Number(e.target.value));
  });
  container.querySelector('#tr-prev-ctx')?.addEventListener('change', (e) => {
    updateDraftSetting('prevContextLines', Math.max(0, Number(e.target.value) || 0));
  });
  container.querySelector('#tr-next-ctx')?.addEventListener('change', (e) => {
    updateDraftSetting('nextContextLines', Math.max(0, Number(e.target.value) || 0));
  });

  container.querySelector('#btn-start-translate')?.addEventListener('click', async () => {
    if (!selectedFile) return;
    try {
      await translateFileInBatches(selectedFile);
      showToast('Batch translation finished.', 'success');
    } catch (err) {
      showToast(err?.message || 'Translation failed', 'error');
    }
  });

  container.querySelector('#btn-cancel-translate')?.addEventListener('click', () => {
    cancelActiveTranslation();
    showToast('Translation cancelled.', 'warning');
  });

  container.querySelector('#btn-export-download')?.addEventListener('click', () => {
    if (!selectedFile) return;
    const outName = downloadSubtitleFile(selectedFile, s.targetLanguage);
    showToast(`Downloaded ${outName}`, 'success');
  });
}

/* =========================================================
   3. SUBTITLE EDITOR (Paginated + 6 Exact Filters + Retranslate)
   ========================================================= */
function entryMatchesFilter(entry, filter, settings) {
  const hasTrans = hasActualTranslation(entry);
  switch (filter) {
    case 'Untranslated':
      return !hasTrans;
    case 'Translated':
      return hasTrans;
    case 'Missing':
      return entry.status === 'missing' && !hasTrans;
    case 'Hindi / Urdu':
      return isHindiOrUrduScriptEntry(entry);
    case 'Suspicious':
      return isSuspiciousEntry(entry, settings);
    case 'All':
    default:
      return true;
  }
}

function renderEditor(container) {
  const file = getSelectedFile();
  if (!file) {
    container.innerHTML = `
      <div class="card empty-state stack-md">
        <div>No active subtitle file selected. Upload and select a file in Translator first.</div>
        <div><button type="button" class="btn btn-primary" data-nav="translator">Go to Translator</button></div>
      </div>
    `;
    container.querySelector('[data-nav="translator"]')?.addEventListener('click', () => navigateTo('translator'));
    return;
  }

  const settings = state.draftSettings;
  const searchLower = state.editor.search.trim().toLowerCase();

  const filtered = file.entries.filter((e) => {
    if (!entryMatchesFilter(e, state.editor.filter, settings)) return false;
    if (searchLower) {
      const hitOrig = (e.originalText || '').toLowerCase().includes(searchLower);
      const hitTrans = (e.translatedText || '').toLowerCase().includes(searchLower);
      const hitId = (e.entryNumber || '').toLowerCase().includes(searchLower);
      return hitOrig || hitTrans || hitId;
    }
    return true;
  });

  const pageSize = Number(settings.editorPageSize) || 50;
  const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
  if (state.editor.page > totalPages) state.editor.page = totalPages;
  const startIdx = (state.editor.page - 1) * pageSize;
  const pageEntries = filtered.slice(startIdx, startIdx + pageSize);

  const counts = {
    All: file.entries.length,
    Untranslated: file.entries.filter((e) => entryMatchesFilter(e, 'Untranslated', settings)).length,
    Translated: file.entries.filter((e) => entryMatchesFilter(e, 'Translated', settings)).length,
    Missing: file.entries.filter((e) => entryMatchesFilter(e, 'Missing', settings)).length,
    'Hindi / Urdu': file.entries.filter((e) => entryMatchesFilter(e, 'Hindi / Urdu', settings)).length,
    Suspicious: file.entries.filter((e) => entryMatchesFilter(e, 'Suspicious', settings)).length
  };

  container.innerHTML = `
    <div class="stack-md">
      <div class="card stack-md">
        <div class="row-between">
          <div>
            <h2 class="card-title">${escapeHtml(file.filename)} <span class="badge badge-cyan">${escapeHtml(file.format.toUpperCase())}</span></h2>
            <p class="card-subtitle">Showing ${filtered.length} of ${file.entries.length} entries (Page ${state.editor.page} / ${totalPages})</p>
          </div>
          <div class="row-wrap">
            ${counts.Untranslated > 0 ? `
              <button type="button" class="btn btn-primary btn-sm" id="ed-translate-untranslated" ${state.translationJob.running ? 'disabled' : ''}>
                ${state.translationJob.running ? 'Translating...' : `Translate Untranslated (${counts.Untranslated})`}
              </button>
            ` : ''}
            <button type="button" class="btn btn-cyan btn-sm" id="ed-download">Download Export</button>
          </div>
        </div>

        <div class="filter-bar">
          ${EDITOR_FILTERS.map((f) => `
            <button type="button" class="filter-btn ${state.editor.filter === f ? 'active' : ''}" data-filter="${escapeHtml(f)}">
              ${escapeHtml(f)} (${counts[f] ?? 0})
            </button>
          `).join('')}
        </div>

        <div class="row-between">
          <input type="text" id="ed-search" class="input" style="max-width:360px;" placeholder="Search original, translated text, or line #..." value="${escapeHtml(state.editor.search)}" />
          <div class="row-wrap">
            <button type="button" class="btn btn-secondary btn-sm" id="ed-prev-page" ${state.editor.page <= 1 ? 'disabled' : ''}>Prev Page</button>
            <span class="text-sm text-muted">Page ${state.editor.page} of ${totalPages}</span>
            <button type="button" class="btn btn-secondary btn-sm" id="ed-next-page" ${state.editor.page >= totalPages ? 'disabled' : ''}>Next Page</button>
          </div>
        </div>
      </div>

      ${pageEntries.length === 0 ? `
        <div class="card empty-state">No subtitle entries match the current filter/search.</div>
      ` : `
        <div class="stack-sm">
          ${pageEntries.map((entry) => {
            const rowKey = `${file.fileId}::${entry.id}`;
            const isRetranslating = state.editor.retranslatingKeys.has(rowKey);
            const hasHiUr = isHindiOrUrduScriptEntry(entry);
            const suspReasons = getSuspiciousReasons(entry, settings);
            const isSusp = suspReasons.length > 0;
            const hasTrans = hasActualTranslation(entry);

            return `
              <div class="sub-row ${hasHiUr ? 'flag-hindi-urdu' : ''} ${isSusp ? 'flag-suspicious' : ''}">
                <div class="sub-row-meta">
                  <div class="row-wrap">
                    <span class="badge badge-muted">#${escapeHtml(entry.entryNumber)}</span>
                    <span class="mono text-sm text-muted">${escapeHtml(entry.timestampLine)}</span>
                    ${entry.meta?.style ? `<span class="badge badge-blue">${escapeHtml(entry.meta.style)}</span>` : ''}
                    ${hasTrans ? `<span class="badge badge-success">Translated</span>` : entry.status === 'missing' ? `<span class="badge badge-danger">Missing</span>` : `<span class="badge badge-muted">Untranslated</span>`}
                    ${hasHiUr ? `<span class="badge badge-warning">Hindi / Urdu Script</span>` : ''}
                    ${isSusp ? `<span class="badge badge-danger" title="${escapeHtml(suspReasons.join('; '))}">Suspicious: ${escapeHtml(suspReasons[0])}</span>` : ''}
                  </div>
                  <div class="row-wrap">
                    ${hasHiUr ? `
                      <button type="button" class="btn btn-primary btn-sm" data-fix-word="${entry.id}" ${isRetranslating ? 'disabled' : ''}>
                        ${isRetranslating ? 'Fixing...' : 'Fix Word'}
                      </button>
                    ` : ''}
                    <button type="button" class="btn btn-secondary btn-sm" data-copy-entry="${entry.id}">Copy</button>
                    <button type="button" class="btn btn-cyan btn-sm" data-retranslate-entry="${entry.id}" ${isRetranslating ? 'disabled' : ''}>
                      ${isRetranslating ? 'Retranslating...' : 'Retranslate'}
                    </button>
                  </div>
                </div>
                <div class="sub-row-cols">
                  <div>
                    <div class="text-sm text-muted" style="margin-bottom:4px;">Original</div>
                    <div class="sub-source-box">${escapeHtml(entry.originalText)}</div>
                  </div>
                  <div>
                    <div class="text-sm text-muted" style="margin-bottom:4px;">Translated (${escapeHtml(settings.targetLanguage)})</div>
                    <textarea class="textarea" rows="2" data-edit-entry="${entry.id}" placeholder="Enter or generate translation...">${escapeHtml(entry.translatedText)}</textarea>
                  </div>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `}
    </div>
  `;

  container.querySelectorAll('[data-filter]').forEach((btn) => {
    btn.addEventListener('click', () => {
      state.editor.filter = btn.dataset.filter;
      state.editor.page = 1;
      notify();
    });
  });

  container.querySelector('#ed-search')?.addEventListener('input', (e) => {
    state.editor.search = e.target.value;
    state.editor.page = 1;
    notify();
  });

  container.querySelector('#ed-prev-page')?.addEventListener('click', () => {
    if (state.editor.page > 1) {
      state.editor.page--;
      notify();
    }
  });
  container.querySelector('#ed-next-page')?.addEventListener('click', () => {
    if (state.editor.page < totalPages) {
      state.editor.page++;
      notify();
    }
  });

  container.querySelector('#ed-translate-untranslated')?.addEventListener('click', async () => {
    try {
      await translateFileInBatches(file);
      showToast('Translated remaining untranslated lines.', 'success');
    } catch (err) {
      showToast(err?.message || 'Translation failed', 'error');
    }
  });

  container.querySelector('#ed-download')?.addEventListener('click', () => {
    const out = downloadSubtitleFile(file, settings.targetLanguage);
    showToast(`Downloaded ${out}`, 'success');
  });

  // Inline Edit & Save with requestVersion bump so stale async retranslates cannot overwrite manual edits
  container.querySelectorAll('[data-edit-entry]').forEach((ta) => {
    ta.addEventListener('change', (e) => {
      const entryId = ta.dataset.editEntry;
      const entry = file.entries.find((item) => item.id === entryId);
      if (!entry) return;
      const rowKey = `${file.fileId}::${entryId}`;
      state.editor.entryRequestVersions.set(
        rowKey,
        (state.editor.entryRequestVersions.get(rowKey) || 0) + 1
      );
      entry.translatedText = e.target.value;
      entry.status = e.target.value.trim() ? 'translated' : 'untranslated';
      notify();
    });
  });

  container.querySelectorAll('[data-copy-entry]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const entry = file.entries.find((item) => item.id === btn.dataset.copyEntry);
      if (!entry) return;
      const text = entry.translatedText || entry.originalText;
      await copyToClipboard(text);
      showToast('Copied line to clipboard.', 'success');
    });
  });

  container.querySelectorAll('[data-fix-word]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const entryId = btn.dataset.fixWord;
      try {
        const res = await fixHindiUrduLineToHinglish(file, entryId);
        if (res?.ok) showToast('Fixed Hindi/Urdu words to Hinglish.', 'success');
      } catch (err) {
        showToast(err?.message || 'Fix Word failed', 'error');
      }
    });
  });

  container.querySelectorAll('[data-retranslate-entry]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const entryId = btn.dataset.retranslateEntry;
      try {
        const res = await retranslateSingleEntry(file, entryId);
        if (res?.ok) showToast('Entry retranslated freshly.', 'success');
      } catch (err) {
        showToast(err?.message || 'Retranslation failed', 'error');
      }
    });
  });
}

          </div>
        `}

  });

    e.preventDefault();
    const src = container.querySelector('#tm-src').value.trim();
    const tgt = container.querySelector('#tm-tgt').value.trim();
    if (!src || !tgt) return;
    const item = { id: `tm_${Date.now()}`, source: src, target: tgt, updatedAt: Date.now() };
    await putTMItem(item);
    state.tm = [item, ...state.tm];
    notify();
  });

  container.querySelectorAll('[data-tm-del]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      await deleteTMItem(btn.dataset.tmDel);
      state.tm = state.tm.filter((i) => i.id !== btn.dataset.tmDel);
      notify();
    });
  });

  container.querySelector('#tm-clear')?.addEventListener('click', async () => {
    const ok = await showConfirmModal({ title: 'Clear Translation Memory?', message: 'Delete all stored TM pairs?', confirmLabel: 'Clear', danger: true });
    if (!ok) return;
    await clearAllTM();
    state.tm = [];
    notify();
  });

  container.querySelector('#tm-export-json')?.addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(state.tm, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'yukisub-translation-memory.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 500);
  });

  const impFile = container.querySelector('#tm-import-file');
  container.querySelector('#tm-import-btn')?.addEventListener('click', () => impFile?.click());
  impFile?.addEventListener('change', async (e) => {
    const f = e.target.files?.[0];
    if (!f) return;
    try {
      const arr = JSON.parse(await f.text());
      if (Array.isArray(arr)) {
        for (const r of arr) {
          if (r.source && r.target) {
            const item = { id: r.id || `tm_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`, source: r.source, target: r.target, updatedAt: Date.now() };
            await putTMItem(item);
            state.tm.unshift(item);
          }
        }
        showToast('Imported Translation Memory.', 'success');
        notify();
      }
    } catch {
      showToast('Invalid JSON file.', 'error');
    }
  });
}

  container.querySelector('#gl-add-form')?.addEventListener('submit', async (e) => {

    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'yukisub-glossary.csv';

  impFile?.addEventListener('change', async (e) => {
    const f = e.target.files?.[0];
    if (!f) return;
    const text = await f.text();
    if (f.name.toLowerCase().endsWith('.json')) {
      const arr = JSON.parse(text);
      if (Array.isArray(arr)) {
        for (const r of arr) {

        const idx = line.indexOf(',');
        if (idx > 0) {
          const source = line.slice(0, idx).replace(/^"|"$/g, '').trim();
          const target = line.slice(idx + 1).replace(/^"|"$/g, '').trim();
          if (source && target) {
            const item = { id: `gl_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`, source, target };
            await putGlossaryItem(item);
            state.glossary.push(item);
          }
        }
      }
    }
    showToast('Glossary imported.', 'success');
    notify();
  });
}

        </div>

        ${diag ? `
          <div class="stack-sm">
            <div class="row-wrap">
              <span class="badge ${diag.failed === 0 ? 'badge-success' : 'badge-danger'}">${diag.passed} / ${diag.total} Passed</span>
              <span class="text-sm text-muted">Ran at ${formatDateTime(diag.ranAt)}</span>
            </div>
            ${diag.results.map((r) => `
              <div class="card-secondary row-between">
                <div>
                  <div style="font-weight:600;">${escapeHtml(r.name)}</div>
                  ${r.error ? `<div class="text-sm" style="color:#FCA5A5;">${escapeHtml(r.error)}</div>` : ''}
                </div>
                <div class="row-wrap">
                  <span class="text-sm text-muted">${r.durationMs}ms</span>
                  <span class="badge ${r.passed ? 'badge-success' : 'badge-danger'}">${r.passed ? 'PASS' : 'FAIL'}</span>
                </div>
              </div>
            `).join('')}
          </div>
        ` : `<div class="empty-state">Click "Run Diagnostics" to run all 12 self-tests.</div>`}
      </div>
    </div>
  `;

  container.querySelector('#diag-run-btn')?.addEventListener('click', async () => {
    state.diagnosticsRunning = true;
    notify();
    state.diagnosticsResult = await runDiagnosticsSuite();
    state.diagnosticsRunning = false;
    notify();
  });
}

      </div>
      <p class="tg-quote" style="margin:0;">
        YukiSub Translater! is built for anime fansubbing workflows with strict format-preserving parsers (.srt, .vtt, .ass, .ssa),
        Roman-script Hinglish conversational prompting, Least-Loaded + Round-Robin Gemini API key balancing, and isolated fresh-upload sessions.
      </p>
      <div class="grid-2">
        <div class="card-secondary stack-sm">
          <strong>Supported Formats</strong>
          <div class="text-sm text-muted">SRT, WebVTT, ASS, and SSA with full preservation of timestamps, styles, override tags, and Dialogue commas.</div>
        </div>
        <div class="card-secondary stack-sm">
          <strong>Security & Storage</strong>

  `;
}
function renderActiveView(container) {
  switch (state.activeNav) {
    case 'dashboard': return renderDashboard(container);
    case 'translator': return renderTranslator(container);
    case 'editor': return renderEditor(container);
    case 'history': return renderHistory(container);
    case 'tm': return renderTM(container);
    case 'glossary': return renderGlossary(container);
    case 'custom-prompts': return renderCustomPrompts(container);
    case 'languages': return renderLanguages(container);
    case 'models': return renderModels(container);
    case 'api-keys': return renderApiKeys(container);
    case 'thinking': return renderThinkingMode(container);
    case 'settings': return renderGeneralSettings(container);
    case 'diagnostics': return renderDiagnostics(container);
    case 'about': return renderAbout(container);
    default: return renderDashboard(container);
  }
}


// === js/main.js ===






function renderNavigation() {
  const sidebar = document.getElementById('sidebar');
  const sidebarNav = document.getElementById('sidebar-nav');
  const mobileNav = document.getElementById('mobile-nav');
  const moreSheetRoot = document.getElementById('more-sheet-root');
  const sidebarToggle = document.getElementById('sidebar-toggle');
  const brandLogo = document.getElementById('brand-logo');

  if (brandLogo) brandLogo.innerHTML = ICONS.logo;
  if (sidebar) sidebar.classList.toggle('collapsed', state.sidebarCollapsed);
  if (sidebarToggle) {
    sidebarToggle.innerHTML = state.sidebarCollapsed ? ICONS.chevronRight : ICONS.chevronLeft;
  }

  if (sidebarNav) {
    sidebarNav.innerHTML = NAV_SECTIONS.map((item) => `
      <button type="button" class="nav-item ${state.activeNav === item.id ? 'active' : ''}" data-nav-id="${item.id}" title="${escapeHtml(item.label)}">
        <span class="nav-icon">${ICONS[item.icon] || ''}</span>
        <span class="nav-label">${escapeHtml(item.label)}</span>
      </button>
    `).join('');

    sidebarNav.querySelectorAll('[data-nav-id]').forEach((btn) => {
      btn.addEventListener('click', () => navigateTo(btn.dataset.navId));
    });
  }

  // Mobile bottom nav: 4 primary items + More button
  if (mobileNav) {
    const primary = NAV_SECTIONS.filter((n) => n.primaryMobile);
    const isSecondaryActive = !primary.some((p) => p.id === state.activeNav);
    mobileNav.innerHTML = `
      ${primary.map((item) => `
        <button type="button" class="mobile-nav-btn ${state.activeNav === item.id ? 'active' : ''}" data-mob-nav="${item.id}">
          <span class="nav-icon">${ICONS[item.icon] || ''}</span>
          <span>${escapeHtml(item.label.split(' ')[0])}</span>
        </button>
      `).join('')}
      <button type="button" class="mobile-nav-btn ${isSecondaryActive ? 'active' : ''}" id="mob-more-btn">
        <span class="nav-icon">${ICONS.more}</span>
        <span>More</span>
      </button>
    `;

    mobileNav.querySelectorAll('[data-mob-nav]').forEach((btn) => {
      btn.addEventListener('click', () => navigateTo(btn.dataset.mobNav));
    });
    mobileNav.querySelector('#mob-more-btn')?.addEventListener('click', () => {
      state.mobileMoreOpen = !state.mobileMoreOpen;
      renderApp();
    });
  }

  // More sheet for remaining 10 sections
  if (moreSheetRoot) {
    if (!state.mobileMoreOpen) {
      moreSheetRoot.innerHTML = '';
    } else {
      const secondary = NAV_SECTIONS.filter((n) => !n.primaryMobile);
      moreSheetRoot.innerHTML = `
        <div class="more-sheet-backdrop" id="more-sheet-backdrop">
          <div class="more-sheet">
            <div class="row-between">
              <strong style="font-size:15px;">More Sections</strong>
              <button type="button" class="btn btn-secondary btn-sm" id="more-sheet-close">Close</button>
            </div>
            <div class="more-sheet-grid">
              ${secondary.map((item) => `
                <button type="button" class="btn ${state.activeNav === item.id ? 'btn-primary' : 'btn-secondary'}" style="justify-content:flex-start;" data-sheet-nav="${item.id}">
                  <span class="nav-icon">${ICONS[item.icon] || ''}</span>
                  <span>${escapeHtml(item.label)}</span>
                </button>
              `).join('')}
            </div>
          </div>
        </div>
      `;

      moreSheetRoot.querySelector('#more-sheet-close')?.addEventListener('click', () => {
        state.mobileMoreOpen = false;
        renderApp();
      });
      moreSheetRoot.querySelector('#more-sheet-backdrop')?.addEventListener('click', (e) => {
        if (e.target.id === 'more-sheet-backdrop') {
          state.mobileMoreOpen = false;
          renderApp();
        }
      });
      moreSheetRoot.querySelectorAll('[data-sheet-nav]').forEach((btn) => {
        btn.addEventListener('click', () => navigateTo(btn.dataset.sheetNav));
      });
    }
  }
}

function renderTopbarAndFooter() {
  const titleEl = document.getElementById('topbar-title');
  const unsavedBadge = document.getElementById('unsaved-badge');
  const topbarActions = document.getElementById('topbar-actions');
  const keyPill = document.getElementById('sidebar-key-pill');
  const modelPill = document.getElementById('sidebar-model-pill');

  const currentSection = NAV_SECTIONS.find((n) => n.id === state.activeNav);
  if (titleEl) titleEl.textContent = currentSection ? `${currentSection.label}!` : 'Dashboard!';

  const unsaved = hasUnsavedChanges();
  if (unsavedBadge) unsavedBadge.classList.toggle('hidden', !unsaved);

  if (topbarActions) {
    topbarActions.innerHTML = unsaved
      ? `<button type="button" class="btn btn-primary btn-sm" id="topbar-save-btn">Save Settings</button>`
      : '';
    topbarActions.querySelector('#topbar-save-btn')?.addEventListener('click', async () => {
      const ok = await saveSettings();
      showToast(ok ? 'Settings saved.' : 'Failed to save settings.', ok ? 'success' : 'error');
    });
  }

  const keySummary = getActiveKeysSummary();
  if (keyPill) keyPill.textContent = `${keySummary.usable} Key${keySummary.usable === 1 ? '' : 's'}`;
  if (modelPill) modelPill.textContent = state.draftSettings.selectedModel || 'No model';
}

let lastRenderedNav = null;

function renderApp() {
  const activeEl = document.activeElement;
  const activeId = activeEl && activeEl.id === 'ed-search' ? activeEl.id : null;
  const selStart = activeId ? activeEl.selectionStart : null;
  const selEnd = activeId ? activeEl.selectionEnd : null;

  renderNavigation();
  renderTopbarAndFooter();
  const main = document.getElementById('main-content');
  if (main) {
    const navChanged = lastRenderedNav !== state.activeNav;
    lastRenderedNav = state.activeNav;
    if (navChanged) {
      main.classList.remove('view-animate');
      void main.offsetWidth;
      main.classList.add('view-animate');
    } else {
      main.classList.remove('view-animate');
    }
    renderActiveView(main);
  }

  if (activeId) {
    const restored = document.getElementById(activeId);
    if (restored) {
      restored.focus();
      if (typeof selStart === 'number' && typeof selEnd === 'number') {
        try { restored.setSelectionRange(selStart, selEnd); } catch {}
      }
    }
  }
}

async function bootstrap() {
  document.getElementById('sidebar-toggle')?.addEventListener('click', () => {
    state.sidebarCollapsed = !state.sidebarCollapsed;
    renderNavigation();
  });

  window.addEventListener('beforeunload', (e) => {
    if (hasUnsavedChanges()) {
      e.preventDefault();
      e.returnValue = '';
    }
  });

  subscribe(renderApp);
  await initAppState();
  renderApp();
}

bootstrap();
